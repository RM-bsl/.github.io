<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BS+1 Mathematik &middot; Analyse einer linearen Funktion (Gartenpool &amp; Netflix-Streaming)</title>
  <meta name="description" content="Autarke iOS-Lernanwendung für die Berufsschule Plus 1 (BS+1 Bayern): Analyse einer linearen Funktion (Verlauf, y-Achsenabschnitt, Nullstelle) wahlweise am Beispiel eines Gartenpools oder jährlicher Netflix-Streaming-Kosten.">
  <style>
    /* ==========================================================================
       1. APPLE iOS 18 DESIGN SYSTEM & TOKENS (HIG LIGHT MODE)
       ========================================================================== */
    :root {
      /* Verbindliche iOS Systemfarben (Light Mode) */
      --ios-bg-grouped: #F2F2F7;
      --ios-card-bg: #FFFFFF;
      --ios-glass-bg: rgba(255, 255, 255, 0.86);
      --ios-text-primary: #1C1C1E;
      --ios-text-secondary: #6C6C70;
      --ios-blue: #007AFF;
      --ios-blue-hover: #0066D6;
      --ios-blue-tint: rgba(0, 122, 255, 0.12);
      --ios-green: #34C759;
      --ios-green-dark: #248A3D;
      --ios-green-tint: rgba(52, 199, 89, 0.14);
      --ios-orange: #FF9500;
      --ios-orange-tint: rgba(255, 149, 0, 0.14);
      --ios-purple: #AF52DE;
      --ios-purple-tint: rgba(175, 82, 222, 0.14);
      --ios-yellow-bg: #FFF9E6;
      --ios-yellow-border: #FFCC00;
      --ios-yellow-text: #7A5800;
      --ios-red-bg: #FFECEB;
      --ios-red: #FF3B30;
      --ios-separator: rgba(60, 60, 67, 0.12);
      --ios-fill-tertiary: rgba(118, 118, 128, 0.12);
      --ios-fill-quaternary: rgba(116, 116, 128, 0.08);

      /* iOS Radien (inkl. 18px für Karten), Schatten & Schriften */
      --ios-radius-xl: 22px;
      --ios-radius-card: 18px;
      --ios-radius-lg: 16px;
      --ios-radius-md: 12px;
      --ios-radius-pill: 9999px;
      --ios-shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --ios-shadow-float: 0 8px 30px rgba(0, 122, 255, 0.18);
      --ios-shadow-segment: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
      --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--ios-font);
      background-color: var(--ios-bg-grouped);
      color: var(--ios-text-primary);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. ANTI-LATEX MATHEMATIK-TYPOGRAFIE & HILFSKLASSEN
       ========================================================================== */
    .math-inline {
      display: inline-flex;
      align-items: center;
      gap: 0.15em;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .math-var {
      font-style: italic;
      font-weight: 600;
    }

    .math-fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1.08;
      font-size: 0.9em;
      margin: 0 0.18em;
      font-weight: 600;
    }

    .math-fraction-num {
      padding: 0 0.3em 0.1em;
      border-bottom: 1.6px solid currentColor;
      text-align: center;
    }

    .math-fraction-den {
      padding: 0.1em 0.3em 0;
      text-align: center;
    }

    /* ==========================================================================
       3. TOP HEADER MIT THEMEN-SCHALTER & iOS SEGMENTED CONTROL
       ========================================================================== */
    .ios-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--ios-glass-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--ios-separator);
    }

    .header-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .app-icon-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(145deg, #007AFF 0%, #0055D4 100%);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.28);
      flex-shrink: 0;
    }

    .brand-eyebrow {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ios-blue);
      margin: 0;
    }

    .brand-title {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0;
      color: var(--ios-text-primary);
    }

    .header-status-cluster {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.48rem;
      padding: 0.36rem 0.78rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-fill-quaternary);
      border: 1px solid var(--ios-separator);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ios-text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .progress-dots {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
    }

    .progress-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(60, 60, 67, 0.22);
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.is-done {
      background: var(--ios-green);
      transform: scale(1.15);
    }

    /* Praxisthema Schalter (Gartenpool vs. Netflix) */
    .theme-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding-top: 0.2rem;
      border-top: 1px solid rgba(60, 60, 67, 0.08);
    }

    .theme-select-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ios-text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .theme-segmented {
      display: inline-flex;
      background: var(--ios-fill-tertiary);
      padding: 2.5px;
      border-radius: 10px;
      gap: 2.5px;
    }

    .theme-tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 0.38rem 0.75rem;
      border-radius: 7.5px;
      font-family: var(--ios-font);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ios-text-secondary);
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
    }

    .theme-tab-btn.is-active {
      background: var(--ios-card-bg);
      color: var(--ios-text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    /* iOS Segmented Control (Timeline vs. Entdeckung) */
    .segmented-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .ios-segmented {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 680px;
      padding: 3px;
      background: var(--ios-fill-tertiary);
      border-radius: 11px;
      gap: 3px;
    }

    .segment-btn {
      position: relative;
      z-index: 1;
      appearance: none;
      border: none;
      background: transparent;
      padding: 0.48rem 0.75rem;
      border-radius: 8.5px;
      font-family: var(--ios-font);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ios-text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      min-height: 38px;
      text-align: center;
      line-height: 1.25;
    }

    .segment-btn.is-active {
      background: var(--ios-card-bg);
      color: var(--ios-text-primary);
      box-shadow: var(--ios-shadow-segment);
    }

    /* ==========================================================================
       4. HAUPTCONTAINER, CARDS & BUTTONS
       ========================================================================== */
    .app-main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3.5rem;
    }

    .ios-card {
      background: var(--ios-card-bg);
      border-radius: var(--ios-radius-card);
      box-shadow: var(--ios-shadow-card);
      border: 1px solid rgba(60, 60, 67, 0.07);
      padding: 1.35rem 1.45rem;
      margin-bottom: 1.1rem;
    }

    .section-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ios-blue);
      background: var(--ios-blue-tint);
      padding: 0.25rem 0.65rem;
      border-radius: var(--ios-radius-pill);
      margin-bottom: 0.55rem;
    }

    .section-eyebrow.eyebrow-green {
      color: var(--ios-green-dark);
      background: var(--ios-green-tint);
    }

    .card-title {
      margin: 0 0 0.45rem;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ios-text-primary);
    }

    .card-subtitle {
      margin: 0;
      color: var(--ios-text-secondary);
      font-size: 0.96rem;
    }

    /* Buttons */
    .ios-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 44px;
      padding: 0.58rem 1.1rem;
      border-radius: var(--ios-radius-md);
      border: 1px solid transparent;
      font-family: var(--ios-font);
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.18s ease, box-shadow 0.18s ease;
      text-decoration: none;
      line-height: 1.25;
    }

    .ios-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .ios-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .ios-btn-primary {
      background: var(--ios-blue);
      color: #FFFFFF;
      box-shadow: var(--ios-shadow-float);
    }

    .ios-btn-primary:hover:not(:disabled) {
      background: var(--ios-blue-hover);
    }

    .ios-btn-tinted {
      background: var(--ios-blue-tint);
      color: var(--ios-blue);
    }

    .ios-btn-tinted:hover:not(:disabled) {
      background: rgba(0, 122, 255, 0.18);
    }

    .ios-btn-success {
      background: var(--ios-green);
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(52, 199, 89, 0.25);
    }

    .ios-btn-secondary {
      background: var(--ios-fill-quaternary);
      color: var(--ios-text-primary);
      border-color: var(--ios-separator);
    }

    .ios-btn-secondary:hover:not(:disabled) {
      background: var(--ios-fill-tertiary);
    }

    .ios-btn-reset {
      min-height: 34px;
      padding: 0.34rem 0.72rem;
      font-size: 0.8rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-red-bg);
      color: var(--ios-red);
      border: 1px solid rgba(255, 59, 48, 0.2);
      font-weight: 600;
      cursor: pointer;
      font-family: var(--ios-font);
    }

    .ios-btn-sm {
      min-height: 36px;
      padding: 0.38rem 0.8rem;
      font-size: 0.84rem;
      border-radius: 10px;
    }

    /* ==========================================================================
       5. LEHRKRAFT-TIMELINE MIT DIDAKTISCHEM KOORDINATENSYSTEM
       ========================================================================== */
    .leitfrage-box {
      margin-top: 1rem;
      padding: 1rem 1.15rem;
      border-radius: var(--ios-radius-lg);
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.09) 0%, rgba(52, 199, 89, 0.08) 100%);
      border: 1px solid rgba(0, 122, 255, 0.22);
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }

    .leitfrage-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ios-blue);
    }

    .leitfrage-text {
      margin: 0;
      font-size: 1.14rem;
      font-weight: 700;
      color: var(--ios-text-primary);
    }

    /* Didaktische Steuerungsleiste für Lehrkräfte */
    .teacher-control-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .teacher-focus-btn {
      appearance: none;
      border: 1px solid var(--ios-separator);
      background: var(--ios-card-bg);
      padding: 0.45rem 0.85rem;
      border-radius: var(--ios-radius-pill);
      font-family: var(--ios-font);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ios-text-secondary);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .teacher-focus-btn.is-active {
      background: var(--ios-blue);
      color: #FFFFFF;
      border-color: var(--ios-blue);
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.24);
    }

    /* iOS Ein/Aus-Umschalter für den relevanten Quadranten in der Timeline */
    .quadrant-toggle-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.42rem 0.85rem;
      border-radius: var(--ios-radius-pill);
      border: 1.5px solid var(--ios-separator);
      background: var(--ios-card-bg);
      font-family: var(--ios-font);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ios-text-primary);
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .quadrant-toggle-btn.is-on {
      background: var(--ios-green-tint);
      border-color: rgba(52, 199, 89, 0.55);
      color: var(--ios-green-dark);
    }

    .ios-switch-track {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      border-radius: var(--ios-radius-pill);
      background: rgba(120, 120, 128, 0.28);
      transition: background-color 0.25s ease;
      flex-shrink: 0;
    }

    .quadrant-toggle-btn.is-on .ios-switch-track {
      background: var(--ios-green);
    }

    .ios-switch-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      transition: transform 0.25s ease;
    }

    .quadrant-toggle-btn.is-on .ios-switch-knob {
      transform: translateX(16px);
    }

    /* Datentabelle */
    .data-table-wrap {
      overflow-x: auto;
      margin-top: 0.9rem;
      border-radius: var(--ios-radius-md);
      border: 1px solid var(--ios-separator);
      background: #FAFAFC;
    }

    .ios-data-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }

    .ios-data-table th,
    .ios-data-table td {
      padding: 0.58rem 0.7rem;
      text-align: center;
      border-bottom: 1px solid var(--ios-separator);
      border-right: 1px solid var(--ios-separator);
    }

    .ios-data-table tr:last-child th,
    .ios-data-table tr:last-child td {
      border-bottom: none;
    }

    .ios-data-table th:last-child,
    .ios-data-table td:last-child {
      border-right: none;
    }

    .ios-data-table th {
      text-align: left;
      background: rgba(0, 122, 255, 0.06);
      color: var(--ios-text-primary);
      font-weight: 700;
      width: 255px;
      min-width: 215px;
      line-height: 1.3;
    }

    .table-math-sub {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ios-text-secondary);
      margin-top: 0.16rem;
    }

    /* 4-Quadranten-Erklärungsraster in der Timeline */
    .quadrants-explainer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 0.95rem;
    }

    .quadrant-card {
      background: #FAFAFC;
      border: 1.5px solid var(--ios-separator);
      border-radius: var(--ios-radius-md);
      padding: 0.85rem 1rem;
      transition: opacity 0.45s ease, transform 0.35s ease, border-color 0.35s ease, background 0.35s ease;
    }

    .quadrant-card.is-relevant {
      background: linear-gradient(135deg, #F0FDF4 0%, #EFF6FF 100%);
      border-color: rgba(52, 199, 89, 0.55);
      box-shadow: 0 4px 16px rgba(52, 199, 89, 0.10);
    }

    .quadrant-card.is-faded {
      opacity: 0.48;
      background: #F4F4F8;
    }

    .quadrant-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }

    .quadrant-roman-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.18rem 0.6rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-blue-tint);
      color: var(--ios-blue);
    }

    .quadrant-card.is-relevant .quadrant-roman-pill {
      background: var(--ios-green-tint);
      color: var(--ios-green-dark);
    }

    .quadrant-sign-code {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ios-text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .quadrant-card p {
      margin: 0;
      font-size: 0.86rem;
      color: var(--ios-text-secondary);
      line-height: 1.45;
    }

    .quadrant-card.is-relevant p {
      color: var(--ios-text-primary);
    }

    .ios-data-table td.is-point-fixed {
      background: var(--ios-green-tint);
      color: var(--ios-green-dark);
      font-weight: 700;
    }

    .table-check-badge {
      display: inline-block;
      margin-left: 0.25rem;
      color: var(--ios-green-dark);
      font-weight: 800;
      font-size: 0.8rem;
    }

    /* Vertikale Timeline */
    .ios-timeline {
      position: relative;
      margin: 0.5rem 0 0.2rem;
      padding-left: 2.3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .ios-timeline::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 18px;
      bottom: 18px;
      width: 2.5px;
      background: linear-gradient(180deg, var(--ios-blue) 0%, var(--ios-green) 100%);
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      background: #FAFAFC;
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-lg);
      padding: 1rem 1.15rem;
    }

    .timeline-marker {
      position: absolute;
      left: -2.3rem;
      top: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ios-blue);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
      border: 3px solid var(--ios-card-bg);
    }

    .timeline-marker.is-done {
      background: var(--ios-green);
      box-shadow: 0 2px 8px rgba(52, 199, 89, 0.35);
    }

    .timeline-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.3rem;
    }

    .timeline-station-tag {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ios-blue);
    }

    .timeline-title {
      margin: 0 0 0.3rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ios-text-primary);
    }

    .timeline-desc {
      margin: 0;
      font-size: 0.92rem;
      color: var(--ios-text-secondary);
    }

    /* ==========================================================================
       6. OBERFLÄCHE 2B: ADVANCE ORGANIZER HUB
       ========================================================================== */
    .phases-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .phase-hub-card {
      background: var(--ios-card-bg);
      border-radius: var(--ios-radius-card);
      box-shadow: var(--ios-shadow-card);
      border: 1.5px solid rgba(60, 60, 67, 0.09);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.18s ease, border-color 0.18s ease, opacity 0.2s ease;
    }

    .phase-hub-card.is-unlocked:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 122, 255, 0.35);
    }

    .phase-hub-card.is-completed {
      border-color: rgba(52, 199, 89, 0.55);
    }

    .phase-hub-card.is-locked {
      opacity: 0.54;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: none;
    }

    .phase-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.55rem;
    }

    .phase-number-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.26rem 0.65rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-blue-tint);
      color: var(--ios-blue);
    }

    .phase-hub-card.is-locked .phase-number-pill {
      background: var(--ios-fill-tertiary);
      color: var(--ios-text-secondary);
    }

    .phase-hub-card.is-completed .phase-number-pill {
      background: var(--ios-green-tint);
      color: var(--ios-green-dark);
    }

    .solved-check-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ios-green);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.92rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(52, 199, 89, 0.32);
    }

    .locked-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ios-fill-tertiary);
      color: var(--ios-text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .phase-hub-title {
      margin: 0 0 0.35rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ios-text-primary);
    }

    .phase-hub-tool {
      margin: 0 0 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ios-blue);
    }

    .phase-hub-desc {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ios-text-secondary);
    }

    .phase-hub-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ==========================================================================
       7. OBERFLÄCHE 3: AKTIVER WORKSPACE, SLIDER, CANVAS & LIVE-INFOS
       ========================================================================== */
    .workspace-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .phase-stepper-pills {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .stepper-pill {
      appearance: none;
      border: 1px solid var(--ios-separator);
      background: var(--ios-card-bg);
      color: var(--ios-text-secondary);
      padding: 0.38rem 0.78rem;
      border-radius: var(--ios-radius-pill);
      font-family: var(--ios-font);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .stepper-pill.is-current {
      background: var(--ios-blue);
      color: #FFFFFF;
      border-color: var(--ios-blue);
    }

    .stepper-pill.is-done:not(.is-current) {
      background: var(--ios-green-tint);
      color: var(--ios-green-dark);
      border-color: rgba(52, 199, 89, 0.35);
    }

    .stepper-pill:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Canvas Container & Split-Stage (Koordinatensystem + Live-Realszene) */
    .canvas-stage {
      width: 100%;
      background: #FAFAFC;
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-lg);
      padding: 0.65rem;
      margin: 0.9rem 0;
      position: relative;
    }

    .dual-stage-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.32fr) minmax(295px, 0.96fr);
      gap: 0.9rem;
      margin: 0.95rem 0;
      align-items: stretch;
    }

    .stage-panel {
      background: #FAFAFC;
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-lg);
      padding: 0.65rem 0.7rem 0.7rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .stage-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.1rem 0.25rem 0.45rem;
      font-size: 0.79rem;
      font-weight: 700;
      color: var(--ios-text-secondary);
      letter-spacing: 0.01em;
    }

    .stage-live-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.16rem 0.55rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-green-tint);
      color: var(--ios-green-dark);
    }

    .stage-live-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ios-green);
      box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.22);
    }

    .graph-canvas {
      display: block;
      width: 100%;
      height: 350px;
      touch-action: none;
      cursor: crosshair;
      border-radius: 12px;
    }

    .teacher-quadrant-canvas {
      height: 430px;
      cursor: default;
    }

    .scene-canvas {
      display: block;
      width: 100%;
      height: 350px;
      border-radius: 12px;
    }

    .scene-canvas-compact {
      height: 242px;
    }

    /* Phase 1 Seite 1: Harmonisches 2-Spalten-Layout (Links Thema + Achsenregler, Rechts Koordinatensystem + Hinweis) */
    .p1-sliders-and-graph-grid {
      display: grid;
      grid-template-columns: minmax(300px, 0.98fr) minmax(320px, 1.02fr);
      gap: 1.05rem;
      margin: 0.95rem 0 0.25rem;
      align-items: stretch;
    }

    .p1-sliders-stack {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .p1-right-graph-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .p1-explore-graph-canvas {
      height: 326px;
    }

    /* Controls & Sliders */
    .controls-panel {
      background: var(--ios-bg-grouped);
      border-radius: var(--ios-radius-lg);
      padding: 1rem 1.15rem;
      border: 1px solid var(--ios-separator);
      margin-top: 0.75rem;
    }

    .sliders-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .slider-group {
      background: var(--ios-card-bg);
      padding: 0.85rem 1rem;
      border-radius: var(--ios-radius-md);
      border: 1px solid var(--ios-separator);
    }

    .slider-label-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .slider-label-nextline {
      display: block;
      margin-top: 0.15rem;
      font-weight: 600;
      color: var(--ios-text-primary);
    }

    .slider-value-badge {
      font-variant-numeric: tabular-nums;
      background: var(--ios-blue-tint);
      color: var(--ios-blue);
      padding: 0.16rem 0.58rem;
      border-radius: var(--ios-radius-pill);
      font-weight: 700;
      font-size: 0.86rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ios-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      border-radius: var(--ios-radius-pill);
      background: rgba(60, 60, 67, 0.16);
      outline: none;
      margin: 0.5rem 0 0.25rem;
      cursor: pointer;
    }

    .ios-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid var(--ios-blue);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18), 0 1px 2px rgba(0, 0, 0, 0.1);
      cursor: grab;
      transition: transform 0.1s ease;
    }

    .ios-range::-webkit-slider-thumb:active {
      transform: scale(1.1);
      cursor: grabbing;
    }

    .ios-range::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid var(--ios-blue);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
      cursor: grab;
    }

    .slider-axis-hint {
      font-size: 0.78rem;
      color: var(--ios-text-secondary);
      display: flex;
      justify-content: space-between;
    }

    /* Phase 1: Freies Erkunden vs. Punkte eintragen */
    .phase1-step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.75rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-purple-tint);
      color: var(--ios-purple);
      margin-bottom: 0.65rem;
    }

    .locked-table-banner {
      margin-top: 0.85rem;
      padding: 0.95rem 1.15rem;
      border-radius: var(--ios-radius-md);
      background: #FFFFFF;
      border: 1.5px dashed var(--ios-separator);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .real-meaning-card {
      margin-top: 0.85rem;
      padding: 0.95rem 1.15rem;
      border-radius: var(--ios-radius-md);
      background: linear-gradient(135deg, #F0FDF4 0%, #E0F2FE 100%);
      border: 1.5px solid rgba(52, 199, 89, 0.35);
      color: #0F5132;
      font-size: 0.94rem;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    /* Phase 2: Stetigkeit-Erklärung */
    .stetig-info-card {
      margin-top: 1rem;
      background: #FFFFFF;
      border: 1.5px solid rgba(0, 122, 255, 0.24);
      border-radius: var(--ios-radius-lg);
      padding: 1.1rem 1.25rem;
      box-shadow: var(--ios-shadow-card);
    }

    .stetig-card-title {
      margin: 0 0 0.65rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ios-blue);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stetig-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .stetig-col {
      background: #FAFAFC;
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-md);
      padding: 0.85rem 0.95rem;
    }

    .stetig-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ios-text-secondary);
      margin-bottom: 0.35rem;
    }

    .stetig-col p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ios-text-primary);
      line-height: 1.45;
    }

    /* Koordinaten-Statuszeile & Punkt-Pills */
    .crosshair-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-top: 0.9rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--ios-separator);
    }

    .coordinate-readout {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .coord-pill {
      background: var(--ios-card-bg);
      border: 1px solid var(--ios-separator);
      padding: 0.3rem 0.72rem;
      border-radius: 10px;
      font-weight: 700;
      color: var(--ios-text-primary);
    }

    .points-progress-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }

    .point-chip {
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 0.28rem 0.62rem;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-card-bg);
      border: 1px solid var(--ios-separator);
      color: var(--ios-text-secondary);
      transition: all 0.2s ease;
    }

    .point-chip.is-fixed {
      background: var(--ios-green-tint);
      border-color: rgba(52, 199, 89, 0.45);
      color: var(--ios-green-dark);
      font-weight: 700;
    }

    /* Feedback Boxen */
    .feedback-banner {
      margin-top: 0.9rem;
      padding: 0.9rem 1.05rem;
      border-radius: var(--ios-radius-md);
      font-size: 0.92rem;
      line-height: 1.48;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .feedback-banner[hidden] {
      display: none !important;
    }

    .feedback-hint {
      background: var(--ios-yellow-bg);
      border: 1.5px solid var(--ios-yellow-border);
      color: #5C4300;
    }

    .feedback-success {
      background: var(--ios-green-tint);
      border: 1.5px solid rgba(52, 199, 89, 0.45);
      color: #14532D;
    }

    .feedback-info {
      background: var(--ios-blue-tint);
      border: 1.5px solid rgba(0, 122, 255, 0.28);
      color: #004085;
    }

    .feedback-icon {
      font-size: 1.1rem;
      line-height: 1.2;
      flex-shrink: 0;
    }

    /* Freitext Phase 2 */
    .freetext-card {
      margin-top: 1.1rem;
      background: #FAFAFC;
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-lg);
      padding: 1.1rem 1.2rem;
    }

    .ios-textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.8rem 0.95rem;
      border-radius: var(--ios-radius-md);
      border: 1.5px solid rgba(60, 60, 67, 0.18);
      background: var(--ios-card-bg);
      font-family: var(--ios-font);
      font-size: 0.96rem;
      color: var(--ios-text-primary);
      line-height: 1.5;
      resize: vertical;
      margin-top: 0.55rem;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .ios-textarea:focus {
      outline: none;
      border-color: var(--ios-blue);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    /* Phase 3 Live-Ticker & Schritte */
    .telemetry-bar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
      margin-top: 0.75rem;
    }

    .telemetry-tile {
      background: var(--ios-card-bg);
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-md);
      padding: 0.6rem 0.8rem;
    }

    .telemetry-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ios-text-secondary);
    }

    .telemetry-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ios-text-primary);
      font-variant-numeric: tabular-nums;
    }

    .probe-quick-btns {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .live-ticker-box {
      margin-top: 0.75rem;
      padding: 0.75rem 0.95rem;
      border-radius: var(--ios-radius-md);
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.08) 0%, rgba(52, 199, 89, 0.08) 100%);
      border: 1px solid rgba(0, 122, 255, 0.22);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ios-text-primary);
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .inspector-steps {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      margin-top: 1.15rem;
    }

    .inspector-step-card {
      background: #FAFAFC;
      border: 1.5px solid var(--ios-separator);
      border-radius: var(--ios-radius-lg);
      padding: 1.05rem 1.2rem;
      transition: border-color 0.2s ease, opacity 0.2s ease;
    }

    .inspector-step-card.is-active {
      background: var(--ios-card-bg);
      border-color: rgba(0, 122, 255, 0.42);
      box-shadow: 0 3px 14px rgba(0, 122, 255, 0.07);
    }

    .inspector-step-card.is-done {
      background: var(--ios-card-bg);
      border-color: rgba(52, 199, 89, 0.5);
    }

    .inspector-step-card.is-locked {
      opacity: 0.52;
    }

    .step-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.45rem;
    }

    .step-title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .choice-stack {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .choice-option-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      padding: 0.72rem 0.95rem;
      border-radius: var(--ios-radius-md);
      border: 1.5px solid var(--ios-separator);
      background: var(--ios-card-bg);
      font-family: var(--ios-font);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ios-text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      min-height: 46px;
    }

    .choice-option-btn:hover:not(:disabled) {
      border-color: var(--ios-blue);
      background: rgba(0, 122, 255, 0.04);
    }

    .choice-option-btn.is-correct {
      border-color: var(--ios-green);
      background: var(--ios-green-tint);
      color: #14532D;
    }

    .choice-option-btn.is-wrong {
      border-color: var(--ios-red);
      background: var(--ios-red-bg);
      color: #7F1D1D;
    }

    .choice-option-btn:disabled {
      cursor: default;
    }

    /* ==========================================================================
       8. AUFWERTUNG MERKBLÄTTER & ARBEITSBLATT-AUFTRÄGE
       ========================================================================== */
    .ab-callout {
      margin-top: 1.15rem;
      padding: 1.1rem 1.25rem;
      border-radius: var(--ios-radius-card);
      background: linear-gradient(135deg, #EEF6FF 0%, #F4FBF6 100%);
      border: 1.5px solid rgba(0, 122, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .ab-callout-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ios-blue);
      margin-bottom: 0.25rem;
    }

    .ab-callout-text {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ios-text-primary);
    }

    .merkblatt-banner {
      margin-top: 0.95rem;
      padding: 1.2rem 1.35rem;
      border-radius: var(--ios-radius-card);
      background: #FFFFFF;
      border: 2px solid rgba(52, 199, 89, 0.48);
      box-shadow: var(--ios-shadow-card);
    }

    .merkblatt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .merkblatt-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--ios-green-tint);
      color: var(--ios-green-dark);
      padding: 0.28rem 0.75rem;
      border-radius: var(--ios-radius-pill);
    }

    .merk-section {
      background: #FAFAFC;
      border: 1px solid var(--ios-separator);
      border-radius: var(--ios-radius-md);
      padding: 0.9rem 1.05rem;
      margin-top: 0.75rem;
    }

    .merk-section-title {
      margin: 0 0 0.45rem;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--ios-text-primary);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .merk-list {
      margin: 0;
      padding-left: 1.25rem;
      font-size: 0.92rem;
      color: var(--ios-text-primary);
      line-height: 1.5;
    }

    .merk-list li {
      margin-bottom: 0.45rem;
    }

    .merk-rule-box {
      margin-top: 0.75rem;
      padding: 0.75rem 0.95rem;
      border-radius: var(--ios-radius-md);
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.08) 0%, rgba(52, 199, 89, 0.08) 100%);
      border: 1px solid rgba(0, 122, 255, 0.25);
      font-size: 0.92rem;
      font-weight: 600;
    }

    /* Modal Dialog */
    .ios-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .ios-modal-backdrop[hidden] {
      display: none !important;
    }

    .ios-modal-sheet {
      width: 100%;
      max-width: 380px;
      background: var(--ios-card-bg);
      border-radius: var(--ios-radius-xl);
      padding: 1.4rem 1.35rem 1.2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      text-align: center;
    }

      /* ======================================================================

      var Evaluators = {
        checkPhase1Coordinate: function (theme, x, y) {
          var pts = theme.points;
          var i;
          for (i = 0; i < pts.length; i++) {
            if (Math.abs(x - pts[i].t) <= 0.8 && Math.abs(y - pts[i].y) <= (theme.maxY > 150 ? 5 : 3)) {
              return { matched: true, point: pts[i] };

          }

          var swappedDetail = '';
          for (i = 0; i < pts.length; i++) {
            if (Math.abs(x - pts[i].y) <= 2 && Math.abs(y - pts[i].t) <= 2 && pts[i].t !== pts[i].y) {
              swappedDetail = ' Du hast vermutlich Abszisse (Rechtswert x) und Ordinate (Hochwert y) vertauscht: Zum geordneten Wertepaar (' +
                pts[i].t + ' | ' + pts[i].y + ') gehört t = ' + pts[i].t + ' ' + theme.unitX + ' auf die x-Achse / Abszissenachse (Rechtsachse) und ' +
                pts[i].y + ' ' + theme.unitY + ' auf die y-Achse / Ordinatenachse (Hochachse).';
              break;
            }
          }

          if (!swappedDetail) {
            for (i = 0; i < pts.length; i++) {
              if (Math.abs(x - pts[i].t) <= 0.5) {
                swappedDetail = ' Bei der Abszisse t = ' + pts[i].t + ' ' + theme.unitX + ' zeigt die Wertetabelle die Ordinate (Funktionswert) ' + pts[i].y + ' ' + theme.unitY + '.';
                break;

          return {
            matched: false,
            message: AppData.PHASES[0].errorHint + swappedDetail
          };
        },

        evaluatePhase2Text: function (theme, rawText) {
          var text = String(rawText || '').trim();
          var normalized = text.toLowerCase()
            .replace(/ä/g, 'ae')
            .replace(/ö/g, 'oe')
            .replace(/ü/g, 'ue')
            .replace(/ß/g, 'ss');

          var words = text.split(/\s+/).filter(function (w) { return w.length > 0; });
          if (text.length < 8 || words.length < 2) {
            return {
              ok: false,
              message: AppData.PHASES[1].errorHint
            };
          }

          var cleanedForNeg = normalized
            .replace(/nicht\s+(nur|bloss|sprunghaft|ruckartig|auf\s+einmal|schlagartig|unterbrochen)/g, 'positiv_ausdruck');

          var hasFalseNegation = /\b(nicht|kein|keine|niemals)\s+(kontinuier\w*|stetig\w*|ununterbrochen\w*|durchgehend\w*|gleichmaessig\w*|zwischenwert\w*|staendig\w*)/.test(cleanedForNeg);

          var hasIntermediate = /(zwischenwert\w*|dazwischen\w*|zwischen\s+den|jed\w*\s+zeitpunkt|zwischenzeit\w*|keine\s+spruenge|keine\s+luecken|lueckenlos\w*)/.test(cleanedForNeg);

          if ((hasContinuity && hasContext) || (hasContinuity && hasIntermediate) || hasIntermediate) {

        var state = {

          activePhase: null,             // null | 1 | 2 | 3

        };

        function load() {
          try {
            var raw = window.localStorage.getItem(AppData.STORAGE_KEY);
            if (!raw) return;
            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') return;

            if (parsed.currentTheme === 'streaming') state.currentTheme = 'streaming';
            state.topMode = parsed.topMode === 'discovery' ? 'discovery' : 'timeline';
            state.activePhase = (parsed.activePhase === 1 || parsed.activePhase === 2 || parsed.activePhase === 3) ? parsed.activePhase : null;
            if (parsed.v5NeutralQuadrantReady) {
              state.onlyRelevantQuadrant = !!parsed.onlyRelevantQuadrant;
              if (parsed.teacherFocus && parsed.teacherFocus !== 'theme-quadrant') {
                state.teacherFocus = parsed.teacherFocus;
              }
            } else {
              state.onlyRelevantQuadrant = false;
              state.teacherFocus = 'all-quadrants';
            }

            if (parsed.pool) state.pool = mergeThemeState('pool', parsed.pool);
            if (parsed.streaming) state.streaming = mergeThemeState('streaming', parsed.streaming);
          } catch (e) {
            // Fallback auf Standardwerte
          }
        }

        function save() {
          try {
            window.localStorage.setItem(AppData.STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}
        }

        function resetCurrentTheme() {
          var tId = state.currentTheme;
          state[tId] = createDefaultThemeState(tId);
          state.activePhase = null;
          save();
        }

        load();

        return {
          get: function () { return state; },
          getCurrentTheme: function () { return AppData.THEMES[state.currentTheme]; },
          getCurrentThemeState: function () { return state[state.currentTheme]; },
          save: save,
          resetCurrentTheme: resetCurrentTheme,
          isUnlocked: function (phaseId) {
            if (phaseId === 1) return true;

      })();

      /* ======================================================================
         MODUL 5: CANVASRENDERERS (RETINA-SCHARFE VEKTORSZENEN & KOORDINATENSYSTEME)
         ====================================================================== */
      var CanvasRenderers = (function () {
        var MONTH_NAMES = ['Jan', 'Feb', 'M\u00e4r', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

        function getSharpDpr(width) {
          var raw = window.devicePixelRatio || 1;
          // Garantiert gestochen scharfe Vektorkanten auf Smartphones & Desktop-Monitoren
          return Math.min(3, width < 640 ? Math.max(2, raw) : Math.max(1.5, raw));
        }

        function prepareGraphCanvas(canvas, theme) {
          if (!canvas) return null;
          var rect = canvas.getBoundingClientRect();
          var width = Math.max(220, rect.width || 560);
          var height = Math.max(175, rect.height || 340);
          var dpr = getSharpDpr(width);

          if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
          }

          var ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
          ctx.__logicalW = width;
          ctx.__logicalH = height;
          ctx.clearRect(0, 0, width, height);

          var isCompact = width < 400;
          var isMedium = width < 480;
          var padLeft = isCompact ? 38 : (isMedium ? 45 : 56);
          var padRight = isCompact ? 16 : (isMedium ? 22 : 30);
          var padTop = isCompact ? 26 : 34;
          var padBottom = isCompact ? 36 : 46;

          var plotW = Math.max(110, width - padLeft - padRight);
          var plotH = Math.max(96, height - padTop - padBottom);

          var maxX = theme ? theme.maxX : 30;
          var maxY = theme ? theme.maxY : 110;

          return {
            ctx: ctx,
            w: width,
            h: height,
            isCompact: isCompact,
            padLeft: padLeft,
            padRight: padRight,
            padTop: padTop,
            padBottom: padBottom,
            plotW: plotW,
            plotH: plotH,
            maxX: maxX,
            maxY: maxY,
            toPxX: function (xVal) {
              return padLeft + (xVal / maxX) * plotW;
            },
            toPxY: function (yVal) {
              return padTop + plotH - (yVal / maxY) * plotH;
            },
            fromPxX: function (px) {
              var raw = ((px - padLeft) / plotW) * maxX;
              return Math.max(0, Math.min(maxX, raw));
            },
            fromPxY: function (py) {
              var raw = ((padTop + plotH - py) / plotH) * maxY;
              return Math.max(0, Math.min(maxY, raw));
            }
          };
        }

        function prepareSceneCanvas(canvas) {
          if (!canvas) return null;
          var rect = canvas.getBoundingClientRect();
          var width = Math.max(220, rect.width || 440);
          var height = Math.max(175, rect.height || 300);
          var dpr = getSharpDpr(width);

          if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
          }

          var ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
          ctx.__logicalW = width;
          ctx.__logicalH = height;
          ctx.clearRect(0, 0, width, height);

          return { ctx: ctx, w: width, h: height };
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
          var rad = Math.max(0, Math.min(r, w / 2, h / 2));
          ctx.beginPath();
          ctx.moveTo(x + rad, y);
          ctx.lineTo(x + w - rad, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
          ctx.lineTo(x + w, y + h - rad);
          ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
          ctx.lineTo(x + rad, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
          ctx.lineTo(x, y + rad);
          ctx.quadraticCurveTo(x, y, x + rad, y);
          ctx.closePath();
        }

        function drawPillBadge(ctx, text, cx, cy, bgColor, textColor, borderColor) {
          ctx.save();
          var logicalW = ctx.__logicalW || 600;
          var baseFontPx = logicalW < 380 ? 10.2 : 11.4;
          var padX = logicalW < 380 ? 7.5 : 9.5;
          var boxH = logicalW < 380 ? 20 : 22;

          ctx.font = '700 ' + baseFontPx + 'px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
          var measuredW = ctx.measureText(text).width;
          var maxAllowedW = Math.max(80, logicalW - 12);

          if (measuredW + padX * 2 > maxAllowedW) {
            var shrinkFactor = (maxAllowedW - padX * 2) / Math.max(1, measuredW);
            var scaledPx = Math.max(8.8, +(baseFontPx * shrinkFactor).toFixed(2));
            ctx.font = '700 ' + scaledPx + 'px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
            measuredW = ctx.measureText(text).width;
          }

          var boxW = Math.min(maxAllowedW, measuredW + padX * 2);
          var rx = cx - boxW / 2;
          if (logicalW > boxW + 12) {
            rx = Math.max(6, Math.min(logicalW - boxW - 6, rx));
          }
          var drawCx = rx + boxW / 2;
          var ry = cy - boxH / 2;

          ctx.shadowColor = 'rgba(15, 23, 42, 0.12)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 1.5;

          drawRoundedRect(ctx, rx, ry, boxW, boxH, boxH / 2);
          ctx.fillStyle = bgColor;
          ctx.fill();

          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          if (borderColor) {
            ctx.strokeStyle = borderColor;

          ctx.fillStyle = textColor;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

        function drawCoordinateGrid(g, theme) {

          ctx.fillStyle = '#FCFCFE';

          for (x = stepX / 2; x <= g.maxX; x += stepX / 2) {

            ctx.lineTo(px, g.padTop + g.plotH);

          for (y = 0; y <= g.maxY; y += stepY) {

            ctx.moveTo(g.padLeft, py);
            ctx.lineTo(g.padLeft + g.plotW, py);

          var yTopEdge = g.padTop - (g.isCompact ? 6 : 8);
          ctx.beginPath();
          ctx.moveTo(xZero, yZero);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          for (x = 0; x <= g.maxX; x += stepX) {
