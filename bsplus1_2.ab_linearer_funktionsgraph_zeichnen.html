            ctx.lineTo(px, yZero + 4.5);
            ctx.stroke();
            ctx.fillText(String(x), px, yZero + (g.isCompact ? 6 : 7.5));
          }

          // Achsenskalierung y
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          for (y = 0; y <= g.maxY; y += stepY) {
            py = g.toPxY(y);
            ctx.beginPath();
            ctx.moveTo(xZero - 4.5, py);
            ctx.lineTo(xZero, py);
            ctx.stroke();
            ctx.fillText(String(y), xZero - (g.isCompact ? 6.5 : 8.5), py);
          }

          // Achsentitel (Smartphone-optimiert & mathematisch präzise)
          ctx.fillStyle = '#1C1C1E';
          ctx.font = (g.isCompact ? '600 9.6px' : (g.w < 460 ? '600 10.5px' : '600 11.4px')) + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'bottom';
          var xTitle = theme
            ? (g.isCompact ? ('x (Abszisse): ' + theme.shortAxisX) : (g.w < 480 ? ('x-Achse (Abszisse): ' + theme.shortAxisX) : theme.axisLabelX))
            : 'x-Achse / Rechtsachse (Abszissenachse): Zeit t';
          ctx.fillText(xTitle, g.padLeft + g.plotW + 4, g.h - (g.isCompact ? 3 : 5));

          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          var yTitle = theme
            ? (g.isCompact ? ('y (Ordinate): ' + theme.shortAxisY) : (g.w < 480 ? ('y-Achse (Ordinate): ' + theme.shortAxisY) : theme.axisLabelY))
            : 'y-Achse / Hochachse (Ordinatenachse): Funktionswert';
          ctx.fillText(yTitle, Math.max(5, g.padLeft - (g.isCompact ? 32 : 42)), g.isCompact ? 4 : 6);

          ctx.restore();
        }

        /* ====================================================================
           ZEITLOSE, MODERNE VEKTORSZENE A: GARTENPOOL ABPUMPEN
           ==================================================================== */
        function drawGardenPoolScene(ctx, w, h, opts) {
          var t = Math.max(0, Math.min(25, opts.t || 0));
          var level = Math.max(0, Math.min(100, 100 - 4 * t));
          var isPumping = (t > 0.02 && level > 0.2) || opts.mode === 'scanner';
          var density = opts.density != null ? opts.density : 0;
          var compact = w < 360 || h < 215;

          ctx.save();
          drawRoundedRect(ctx, 0, 0, w, h, 12);
          ctx.clip();

          var topSafe = compact ? 31 : 35;
          var botSafe = compact ? 29 : 33;
          var horizonY = Math.max(topSafe + 16, Math.round(h * 0.36));

          // 1. Moderner klarer Architektur-Himmel & sanfte Sonne
          var skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 12);
          skyGrad.addColorStop(0, '#BAE6FD');
          skyGrad.addColorStop(0.62, '#E0F2FE');
          skyGrad.addColorStop(1, '#F8FAFC');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, h);

          var sunX = w - (compact ? 32 : 42);
          var sunY = Math.max(22, Math.round(horizonY * 0.52));
          var sunGlow = ctx.createRadialGradient(sunX, sunY, 3, sunX, sunY, compact ? 26 : 36);
          sunGlow.addColorStop(0, 'rgba(253, 224, 71, 0.90)');
          sunGlow.addColorStop(0.5, 'rgba(253, 224, 71, 0.24)');
          sunGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, compact ? 26 : 36, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FACC15';
          ctx.beginPath();
          ctx.arc(sunX, sunY, compact ? 9.5 : 12, 0, Math.PI * 2);
          ctx.fill();

          // Ruhige moderne Garten-Silhouette & Terrassenebene
          ctx.fillStyle = '#DCFCE7';
          ctx.beginPath();
          ctx.moveTo(0, horizonY);
          for (var hx = 0; hx <= w + 36; hx += 40) {
            ctx.quadraticCurveTo(hx + 20, horizonY - (compact ? 8 : 11), hx + 40, horizonY);
          }
          ctx.lineTo(w, horizonY + 8);
          ctx.lineTo(0, horizonY + 8);
          ctx.closePath();
          ctx.fill();

          var groundGrad = ctx.createLinearGradient(0, horizonY, 0, h);
          groundGrad.addColorStop(0, '#86EFAC');
          groundGrad.addColorStop(0.14, '#4ADE80');
          groundGrad.addColorStop(0.15, '#E7E5E4');
          groundGrad.addColorStop(1, '#D6D3D1');
          ctx.fillStyle = groundGrad;
          ctx.fillRect(0, horizonY, w, h - horizonY);

          // 2. Exakte Becken-Geometrie (100 % passgenau zwischen topSafe und botSafe)
          var rightMargin = compact ? 64 : 84;
          var poolLeft = compact ? 36 : Math.max(42, Math.round(w * 0.12));
          var poolRight = Math.max(poolLeft + 108, w - rightMargin);
          var poolW = poolRight - poolLeft;
          var poolTop = horizonY + 10;
          var poolBottom = h - botSafe;
          var poolH = Math.max(68, poolBottom - poolTop);

          // Edles Holzdeck links & Naturstein-Beckenrand (Travertin)
          drawRoundedRect(ctx, 6, poolTop - 8, Math.max(16, poolLeft - 6), 9, 3);
          ctx.fillStyle = '#A16207';
          ctx.fill();

          drawRoundedRect(ctx, poolLeft - 6, poolTop - 8, poolW + 12, 9, 4);
          ctx.fillStyle = '#F8FAFC';
          ctx.fill();
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          // Moderner Bodeneinlauf / Abfluss rechts
          var drainX = Math.min(w - (compact ? 22 : 30), poolRight + (compact ? 34 : 44));
          var drainY = poolTop + Math.min(20, poolH * 0.22);
          drawRoundedRect(ctx, drainX - 15, drainY, 30, 10, 3.5);
          ctx.fillStyle = '#334155';
          ctx.fill();
          ctx.strokeStyle = '#94A3B8';
          ctx.lineWidth = 1;
          for (var dg = -9; dg <= 9; dg += 6) {
            ctx.beginPath();
            ctx.moveTo(drainX + dg, drainY + 2);
            ctx.lineTo(drainX + dg, drainY + 8);
            ctx.stroke();
          }
          ctx.fillStyle = '#475569';
          ctx.font = (compact ? '600 8.5px' : '600 9.5px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Abfluss', drainX, drainY + 19);

          // 3. Geflieste Becken-Innenwand mit Tiefenwirkung
          drawRoundedRect(ctx, poolLeft, poolTop, poolW, poolH, 9);
          var tileBg = ctx.createLinearGradient(0, poolTop, 0, poolBottom);
          tileBg.addColorStop(0, '#F0F9FF');
          tileBg.addColorStop(0.5, '#E0F2FE');
          tileBg.addColorStop(1, '#BAE6FD');
          ctx.fillStyle = tileBg;
          ctx.fill();

          ctx.save();
          drawRoundedRect(ctx, poolLeft, poolTop, poolW, poolH, 9);
          ctx.clip();

          var tileStep = compact ? 15 : 18;
          ctx.strokeStyle = 'rgba(2, 132, 199, 0.11)';
          ctx.lineWidth = 1;
          for (var tx = poolLeft + tileStep; tx < poolRight; tx += tileStep) {
            ctx.beginPath();
            ctx.moveTo(tx, poolTop);
            ctx.lineTo(tx, poolBottom);
            ctx.stroke();
          }
          for (var ty = poolTop + tileStep; ty < poolBottom; ty += tileStep) {
            ctx.beginPath();
            ctx.moveTo(poolLeft, ty);
            ctx.lineTo(poolRight, ty);
            ctx.stroke();
          }

          // 4. Kristallklares Wasservolumen + Lichtbrechungskante
          var waterTopY = poolBottom - (level / 100) * poolH;
          if (level > 0.25) {
            var waterGrad = ctx.createLinearGradient(0, waterTopY, 0, poolBottom);
            waterGrad.addColorStop(0, 'rgba(56, 189, 248, 0.72)');
            waterGrad.addColorStop(0.45, 'rgba(14, 165, 233, 0.84)');
            waterGrad.addColorStop(1, 'rgba(3, 105, 161, 0.94)');

            ctx.fillStyle = waterGrad;
            ctx.fillRect(poolLeft, waterTopY, poolW, poolBottom - waterTopY);

            // Dezente Unterwasser-Lichtreflexion
            if (poolBottom - waterTopY > 14) {
              var sheenGrad = ctx.createLinearGradient(poolLeft, waterTopY, poolLeft + poolW * 0.65, poolBottom);
              sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
              sheenGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.04)');
              sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
              ctx.fillStyle = sheenGrad;
              ctx.fillRect(poolLeft, waterTopY, poolW, poolBottom - waterTopY);
            }

            // Glatte Meniskus-Lichtkante an der Wasseroberfläche
            ctx.beginPath();
            ctx.moveTo(poolLeft, waterTopY + 0.5);
            ctx.lineTo(poolRight, waterTopY + 0.5);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // Gebürstete Edelstahl-Leiter links
          var ladX = poolLeft + (compact ? 12 : 16);
          ctx.strokeStyle = 'rgba(71, 85, 105, 0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(ladX, poolTop + 2);
          ctx.lineTo(ladX, poolBottom - 8);
          ctx.moveTo(ladX + 10, poolTop + 2);
          ctx.lineTo(ladX + 10, poolBottom - 8);
          for (var rungY = poolTop + 14; rungY < poolBottom - 10; rungY += 16) {
            ctx.moveTo(ladX, rungY);
            ctx.lineTo(ladX + 10, rungY);
          }
          ctx.stroke();

          // Zeitloser Korallrot-Weißer Schwimmring auf dem Wasserspiegel
          var ringX = poolLeft + poolW * 0.44;
          var ringY = level > 3 ? Math.max(poolTop + 6, waterTopY) : poolBottom - 5;
          var ringRx = compact ? 14 : 17;
          var ringRy = compact ? 4.4 : 5.2;

          ctx.save();
          ctx.translate(ringX, ringY);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.15)';
          ctx.beginPath();
          ctx.ellipse(0, 3, ringRx + 1, ringRy, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#EF4444';
          ctx.beginPath();
          ctx.ellipse(0, 0, ringRx, ringRy, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(-ringRx * 0.78, -ringRy * 0.45, ringRx * 0.34, ringRy * 0.9);
          ctx.fillRect(ringRx * 0.44, -ringRy * 0.45, ringRx * 0.34, ringRy * 0.9);

          ctx.fillStyle = level > 3 ? '#0284C7' : '#BAE6FD';
          ctx.beginPath();
          ctx.ellipse(0, 0, ringRx * 0.42, ringRy * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 5. Moderne Titan-Tauchpumpe rechts unten
          var pumpW = compact ? 22 : 26;
          var pumpH = compact ? 20 : 23;
          var pumpX = poolRight - pumpW - (compact ? 8 : 10);
          var pumpY = poolBottom - pumpH - 2;
          drawRoundedRect(ctx, pumpX, pumpY, pumpW, pumpH, 5);
          ctx.fillStyle = '#0F172A';
          ctx.fill();
          ctx.strokeStyle = '#94A3B8';
          ctx.lineWidth = 1.15;
          ctx.stroke();

          var ledColor = level <= 0.2 ? '#FF3B30' : (isPumping ? '#34C759' : '#FFCC00');
          ctx.fillStyle = ledColor;
          ctx.beginPath();
          ctx.arc(pumpX + pumpW / 2, pumpY + 7, 2.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore(); // Ende Pool-Clip

          // Präziser Beckenrahmen + Zentimeter-Skala links (0 bis 100 cm)
          drawRoundedRect(ctx, poolLeft, poolTop, poolW, poolH, 9);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          var cmStep = poolH < 88 ? 50 : 20;
          ctx.fillStyle = '#334155';
          ctx.font = (compact ? '600 8.6px' : '600 9.5px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          for (var cm = 0; cm <= 100; cm += cmStep) {
            var cmy = poolBottom - (cm / 100) * poolH;
            ctx.beginPath();
            ctx.moveTo(poolLeft - 4, cmy);
            ctx.lineTo(poolLeft, cmy);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.fillText(String(cm), poolLeft - 6, cmy);
          }

          // 6. Eleganter Förderschlauch & laminarer Wasserbogen
          var hoseStartX = pumpX + pumpW / 2;
          var hoseStartY = pumpY;
          var hosePeakX = poolRight + 5;
          var hosePeakY = poolTop - 13;
          var nozzleX = drainX - 8;
          var nozzleY = drainY - 9;

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(hoseStartX, hoseStartY);
          ctx.bezierCurveTo(hoseStartX, poolTop + 2, hosePeakX - 8, hosePeakY, nozzleX, nozzleY);
          ctx.strokeStyle = isPumping ? '#0284C7' : '#64748B';
          ctx.lineWidth = compact ? 4.8 : 5.6;
          ctx.lineCap = 'round';
          ctx.stroke();

          if (isPumping) {
            ctx.strokeStyle = '#BAE6FD';
            ctx.lineWidth = 1.7;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(nozzleX, nozzleY);
            ctx.quadraticCurveTo(drainX + 1, nozzleY + 2, drainX, drainY + 3);
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.85)';
            ctx.lineWidth = compact ? 3.2 : 3.8;
            ctx.stroke();
          }
          ctx.restore();

          // 7. Modus-spezifische Didaktik-Overlays
          if (opts.mode === 'scanner') {
            var sensX = poolLeft + poolW * 0.66;
            var sensY = poolTop - 12;
            drawRoundedRect(ctx, sensX - 15, sensY - 6, 30, 11, 3.5);
            ctx.fillStyle = '#0F172A';
            ctx.fill();

            if (density >= 90) {
              var beamGrad = ctx.createLinearGradient(0, sensY + 5, 0, waterTopY);
              beamGrad.addColorStop(0, 'rgba(52, 199, 89, 0.45)');
              beamGrad.addColorStop(1, 'rgba(52, 199, 89, 0.06)');
              ctx.fillStyle = beamGrad;
              ctx.beginPath();
              ctx.moveTo(sensX - 4, sensY + 5);
              ctx.lineTo(sensX + 4, sensY + 5);
              ctx.lineTo(sensX + 15, waterTopY);
              ctx.lineTo(sensX - 15, waterTopY);
              ctx.closePath();
              ctx.fill();
            } else {
              var waveCount = density < 35 ? 2 : 4;
              ctx.strokeStyle = 'rgba(0, 122, 255, 0.72)';
              ctx.lineWidth = 1.6;
              for (var wv = 0; wv < waveCount; wv++) {
                var wFrac = (wv + 1) / (waveCount + 1);
                var wyWave = sensY + 7 + wFrac * Math.max(10, waterTopY - sensY - 9);
                var halfSpan = 4 + wFrac * 11;
                ctx.beginPath();
                ctx.moveTo(sensX - halfSpan, wyWave);
                ctx.quadraticCurveTo(sensX, wyWave + 3, sensX + halfSpan, wyWave);
                ctx.stroke();
              }
            }
          }

          // Unabhängige y-Prüfmarke (Phase 1 Explore / Plot)
          if (opts.probeY != null && (opts.mode === 'explore' || opts.mode === 'plot')) {
            var clampedProbe = Math.max(0, Math.min(100, opts.probeY));
            var markerY = poolBottom - (clampedProbe / 100) * poolH;
            ctx.save();
            ctx.setLineDash([4, 3]);
            ctx.strokeStyle = '#FF9500';
            ctx.lineWidth = 1.75;
            ctx.beginPath();
            ctx.moveTo(poolLeft, markerY);
            ctx.lineTo(poolRight + 7, markerY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#FF9500';
            ctx.beginPath();
            ctx.moveTo(poolRight + 1, markerY);
            ctx.lineTo(poolRight + 8, markerY - 4.5);
            ctx.lineTo(poolRight + 8, markerY + 4.5);
            ctx.closePath();
            ctx.fill();

            if (opts.mode === 'explore') {
              drawPillBadge(
                ctx,
                'y: ' + Formatters.formatNumber(clampedProbe, 0) + ' cm',
                poolRight + (compact ? 32 : 42),
                Math.max(poolTop + 13, Math.min(poolBottom - 11, markerY)),
                '#FF9500',
                '#FFFFFF'
              );
            }
            ctx.restore();
          }

          // 8. Saubere iOS Glass-Badges oben & unten (automatisch randgesichert)
          var hudText = 't = ' + Formatters.formatNumber(t, 1) + ' min \u00b7 Pegel h = ' + Formatters.formatNumber(level, 1) + ' cm';
          drawPillBadge(ctx, hudText, w / 2, 16, 'rgba(255, 255, 255, 0.94)', '#1C1C1E', 'rgba(60, 60, 67, 0.14)');

          var statusLabel = level <= 0.2
            ? '\u2713 Pool komplett leer (0 cm)'
            : (t <= 0.02 ? 'Startzustand vor Pumpenstart (100 cm)' : 'Pumpe f\u00f6rdert stetig (\u22124 cm/min)');
          var statusBg = level <= 0.2 ? '#34C759' : (t <= 0.02 ? '#1C1C1E' : '#007AFF');
          drawPillBadge(ctx, opts.highlightLabel || statusLabel, w / 2, h - 14, statusBg, '#FFFFFF');

          ctx.restore();
        }

        /* ====================================================================
           ZEITLOSE, MODERNE VEKTORSZENE B: NETFLIX STREAMING-KOSTEN (JAN-DEZ)
           ==================================================================== */
        function drawNetflixScene(ctx, w, h, opts) {
          var t = Math.max(0, Math.min(12, opts.t || 0));
          var cost = Math.max(0, Math.min(180, 15 * t));
          var density = opts.density != null ? opts.density : 0;
          var compact = w < 375 || h < 215;

          ctx.save();
          drawRoundedRect(ctx, 0, 0, w, h, 12);
          ctx.clip();

          // 1. Zeitloser Apple-TV / FinTech Dark-Glass Hintergrund
          var bgGrad = ctx.createLinearGradient(0, 0, w, h);
          bgGrad.addColorStop(0, '#0C0E16');
          bgGrad.addColorStop(0.55, '#151928');
          bgGrad.addColorStop(1, '#0F121D');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, w, h);

          var ambi = ctx.createRadialGradient(w * 0.32, h * 0.34, 8, w * 0.32, h * 0.34, Math.max(95, w * 0.42));
          ambi.addColorStop(0, t > 0.02 ? 'rgba(229, 9, 20, 0.28)' : 'rgba(148, 163, 184, 0.12)');
          ambi.addColorStop(1, 'rgba(229, 9, 20, 0)');
          ctx.fillStyle = ambi;
          ctx.fillRect(0, 0, w, h);

          var topSafe = compact ? 31 : 35;
          var botSafe = compact ? 29 : 33;
          var innerH = Math.max(112, h - topSafe - botSafe);

          // Klare 2-Spalten-Architektur: Links Abo-Display & Monatsraster, rechts kumulative Kostensäule
          var colW = compact ? 30 : 38;
          var colX = w - colW - (compact ? 12 : 16);
          var scaleSpace = compact ? 34 : 40;
          var leftX = compact ? 10 : 14;
          var leftW = Math.max(132, colX - scaleSpace - leftX);

          // 2. Kompaktes OLED Abo-Status-Panel oben links
          var tvY = topSafe + 2;
          var tvH = Math.max(46, Math.min(68, Math.round(innerH * 0.35)));

          drawRoundedRect(ctx, leftX, tvY, leftW, tvH, 9);
          ctx.fillStyle = 'rgba(9, 11, 18, 0.88)';
          ctx.fill();
          ctx.strokeStyle = t > 0.02 ? 'rgba(229, 9, 20, 0.62)' : 'rgba(148, 163, 184, 0.32)';
          ctx.lineWidth = 1.4;
          ctx.stroke();

          // Modernes Vektor-'N'-Emblem
          var nCx = leftX + (compact ? 17 : 22);
          var nCy = tvY + (tvH - 8) / 2;
          var nHalfH = compact ? 7.5 : 9;
          var nHalfW = compact ? 4.8 : 5.8;
          ctx.strokeStyle = '#E50914';
          ctx.lineWidth = compact ? 2.8 : 3.3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(nCx - nHalfW, nCy + nHalfH);
          ctx.lineTo(nCx - nHalfW, nCy - nHalfH);
          ctx.lineTo(nCx + nHalfW, nCy + nHalfH);
          ctx.lineTo(nCx + nHalfW, nCy - nHalfH);
          ctx.stroke();

          var textStartX = nCx + nHalfW + (compact ? 9 : 12);
          ctx.fillStyle = '#F8FAFC';
          ctx.font = (compact ? '700 10.2px' : '700 11.5px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          var streamTitle = t <= 0.02
            ? (compact ? 'Abo vor Start (0 \u20AC)' : 'Abo noch nicht gestartet')
            : (t >= 11.98 ? (compact ? '12 Monate komplett' : 'Streaming-Jahr komplett') : 'Aktiv \u00b7 15 \u20AC / Monat');
          ctx.fillText(streamTitle, textStartX, nCy - (compact ? 5.5 : 6.5));

          ctx.fillStyle = '#94A3B8';
          ctx.font = (compact ? '500 9px' : '500 10px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
          var subLine = t <= 0.02
            ? 'Monat 0 \u00b7 0 \u20AC Summe'
            : ('Bis ' + MONTH_NAMES[Math.max(0, Math.min(11, Math.ceil(t) - 1))] + ' (' + Formatters.formatNumber(t, 1) + ' Mon.)');
          ctx.fillText(subLine, textStartX, nCy + (compact ? 6.5 : 7.5));

          // Jahres-Fortschrittsbalken unten im TV-Panel
          var barX = leftX + 10;
          var barY = tvY + tvH - 7;
          var barW = leftW - 20;
          drawRoundedRect(ctx, barX, barY, barW, 3.2, 1.6);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.fill();

          if (t > 0.02) {
            var yearProg = Math.max(0, Math.min(1, t / 12));
            drawRoundedRect(ctx, barX, barY, Math.max(4, barW * yearProg), 3.2, 1.6);
            ctx.fillStyle = '#E50914';
            ctx.fill();
          }

          // 3. Responsives 12-Monats-Kalenderraster (4x3 auf schmalen Smartphones, 6x2 sonst)
          var calTop = tvY + tvH + (compact ? 7 : 9);
          var calAvailH = Math.max(54, h - botSafe - calTop - 2);
          var cols = leftW < 235 ? 4 : 6;
          var rows = cols === 4 ? 3 : 2;
          var gap = compact ? 4 : 5;
          var cellW = (leftW - gap * (cols - 1)) / cols;
          var cellH = Math.min(cols === 4 ? 26 : 38, (calAvailH - gap * (rows - 1)) / rows);

          for (var monthIdx = 0; monthIdx < 12; monthIdx++) {
            var r = Math.floor(monthIdx / cols);
            var c = monthIdx % cols;
            var cx = leftX + c * (cellW + gap);
            var cy = calTop + r * (cellH + gap);
            var fillFrac = Math.max(0, Math.min(1, t - monthIdx));

            drawRoundedRect(ctx, cx, cy, cellW, cellH, 5.5);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.065)';
            ctx.fill();

            if (fillFrac > 0.01) {
              ctx.save();
              drawRoundedRect(ctx, cx, cy, cellW, cellH, 5.5);
              ctx.clip();
              var mGrad = ctx.createLinearGradient(cx, cy, cx, cy + cellH);
              mGrad.addColorStop(0, '#F43F5E');
              mGrad.addColorStop(0.35, '#E50914');
              mGrad.addColorStop(1, '#991B1B');
              ctx.fillStyle = mGrad;
              ctx.fillRect(cx, cy, cellW * fillFrac, cellH);
              ctx.restore();
            }

            drawRoundedRect(ctx, cx, cy, cellW, cellH, 5.5);
            ctx.strokeStyle = fillFrac >= 0.99 ? 'rgba(255, 255, 255, 0.48)' : 'rgba(148, 163, 184, 0.20)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (cellH < 23) {
              ctx.fillStyle = fillFrac > 0.35 ? '#FFFFFF' : '#CBD5E1';
              ctx.font = '700 8.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
              ctx.fillText(MONTH_NAMES[monthIdx], cx + cellW / 2, cy + cellH * 0.52);
            } else {
              ctx.fillStyle = fillFrac > 0.35 ? '#FFFFFF' : '#CBD5E1';
              ctx.font = (compact ? '700 8.6px' : '700 9.4px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
              ctx.fillText(MONTH_NAMES[monthIdx], cx + cellW / 2, cy + cellH * 0.35);

              ctx.font = (compact ? '600 7.8px' : '600 8.4px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
              ctx.fillStyle = fillFrac >= 0.99 ? '#FDE047' : 'rgba(226, 232, 240, 0.68)';
              ctx.fillText(fillFrac >= 0.99 ? '\u2713 15\u20AC' : '15\u20AC', cx + cellW / 2, cy + cellH * 0.73);
            }
          }

          // 4. Kumulative Kosten-Säule rechts (0 € bis 180 €, klar getrennt vom Kalender)
          var colTop = topSafe + 4;
          var colBottom = h - botSafe - 2;
          var colH = Math.max(72, colBottom - colTop);

          drawRoundedRect(ctx, colX, colTop, colW, colH, 8);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.fill();

          var filledH = (cost / 180) * colH;
          var fillTopY = colBottom - filledH;

          if (filledH > 1) {
            ctx.save();
            drawRoundedRect(ctx, colX, colTop, colW, colH, 8);
            ctx.clip();

            var barGrad = ctx.createLinearGradient(0, fillTopY, 0, colBottom);
            barGrad.addColorStop(0, '#FB7185');
            barGrad.addColorStop(0.28, '#E50914');
            barGrad.addColorStop(1, '#881337');
            ctx.fillStyle = barGrad;
            ctx.fillRect(colX, fillTopY, colW, filledH);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
            ctx.lineWidth = 1;
            for (var euroStep = 15; euroStep < 180; euroStep += 15) {
              var stepLineY = colBottom - (euroStep / 180) * colH;
              if (stepLineY >= fillTopY) {
                ctx.beginPath();
                ctx.moveTo(colX, stepLineY);
                ctx.lineTo(colX + colW, stepLineY);
                ctx.stroke();
              }
            }

            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(colX, fillTopY);
            ctx.lineTo(colX + colW, fillTopY);
            ctx.stroke();
            ctx.restore();
          }

          drawRoundedRect(ctx, colX, colTop, colW, colH, 8);
          ctx.strokeStyle = 'rgba(226, 232, 240, 0.36)';
          ctx.lineWidth = 1.4;
          ctx.stroke();

          var eurStep = colH < 96 ? 60 : 30;
          ctx.fillStyle = '#CBD5E1';
          ctx.font = (compact ? '600 8.3px' : '600 9px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          for (var eur = 0; eur <= 180; eur += eurStep) {
            var ey = colBottom - (eur / 180) * colH;
            ctx.beginPath();
            ctx.moveTo(colX - 3.5, ey);
            ctx.lineTo(colX, ey);
            ctx.strokeStyle = 'rgba(203, 213, 225, 0.48)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillText(eur + '\u20AC', colX - 5.5, ey);
          }

          if (opts.mode === 'scanner') {
            ctx.strokeStyle = density >= 90 ? '#34C759' : '#38BDF8';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(colX - 7, fillTopY);
            ctx.lineTo(colX + colW + 7, fillTopY);
            ctx.stroke();
          }

          // Unabhängige y-Prüfmarke (kollisionsfrei an der Kostensäule positioniert)
          if (opts.probeY != null && (opts.mode === 'explore' || opts.mode === 'plot')) {
            var cProbe = Math.max(0, Math.min(180, opts.probeY));
            var pmy = colBottom - (cProbe / 180) * colH;
            ctx.save();
            ctx.strokeStyle = '#FF9500';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(colX - 6, pmy);
            ctx.lineTo(colX + colW + 6, pmy);
            ctx.stroke();
            ctx.setLineDash([]);

            if (opts.mode === 'explore') {
              drawPillBadge(
                ctx,
                'y: ' + Formatters.formatNumber(cProbe, 0) + ' \u20AC',
                colX + colW / 2 - 4,
                Math.max(colTop + 11, Math.min(colBottom - 11, pmy - 13)),
                '#FF9500',
                '#FFFFFF'
              );
            }
            ctx.restore();
          }

          // 5. Saubere iOS Glass-Badges oben & unten
          var topHud = 't = ' + Formatters.formatNumber(t, 1) + ' Mon. \u00b7 Summe K = ' + Formatters.formatNumber(cost, 1) + ' \u20AC';
          drawPillBadge(ctx, topHud, w / 2, 16, 'rgba(255, 255, 255, 0.94)', '#1C1C1E');

          var botText = cost <= 0.1
            ? 'Start bei t = 0: Noch 0 \u20AC Gesamtkosten'
            : (cost >= 179.9 ? '\u2713 Jahresende: 180 \u20AC Gesamtkosten (12 \u00d7 15 \u20AC)' : 'Kosten wachsen stetig (+15 \u20AC / Monat)');
          var botBg = cost >= 179.9 ? '#34C759' : '#E50914';
          drawPillBadge(ctx, opts.highlightLabel || botText, w / 2, h - 14, botBg, '#FFFFFF');

          ctx.restore();
        }

        return {
          getGeometry: prepareGraphCanvas,

          /* REALSZENE (POOL ODER NETFLIX) RUHIG & KLAR RENDERN */
          renderRealScene: function (canvas, theme, sceneOpts) {
            var s = prepareSceneCanvas(canvas);
            if (!s || !theme) return;
            var opts = sceneOpts || { mode: 'inspector', t: 0 };

            if (theme.id === 'pool') {
              drawGardenPoolScene(s.ctx, s.w, s.h, opts);
            } else {
              drawNetflixScene(s.ctx, s.w, s.h, opts);
            }
          },

          /* 1. DIDAKTISCHES 4-QUADRANTEN-KOORDINATENSYSTEM (NEUTRAL BEI AUSGESCHALTETEM BUTTON) */
          renderTeacherCoordinateSystem: function (canvas, focusMode, onlyRelevantQuadrant) {
            if (!canvas) return;
            var theme = StateStore.getCurrentTheme();
            var rect = canvas.getBoundingClientRect();
            var width = Math.max(225, rect.width || 680);
            var height = Math.max(235, rect.height || 430);
            var dpr = getSharpDpr(width);

            if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
              canvas.width = Math.round(width * dpr);
              canvas.height = Math.round(height * dpr);
            }

            var ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = true;
            if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
            ctx.__logicalW = width;
            ctx.__logicalH = height;
            ctx.clearRect(0, 0, width, height);

            var showOnlyRelevant = !!onlyRelevantQuadrant;
            var fade = showOnlyRelevant ? 1 : 0;
            var isPhone = width < 440;

            var padL = isPhone ? 16 : 36;
            var padR = isPhone ? 18 : 36;
            var padT = isPhone ? 30 : 38;
            var padB = isPhone ? 30 : 34;
            var plotW = Math.max(170, width - padL - padR);
            var plotH = Math.max(165, height - padT - padB);
            var halfW = plotW / 2;
            var halfH = plotH / 2;
            var cx = padL + halfW;
            var cy = padT + halfH;

            var qMaxX = theme.qMaxX || 30;
            var qMaxY = theme.qMaxY || 100;
            var qStepX = theme.qStepX || 10;
            var qStepY = theme.qStepY || 50;

            function toX(v) { return cx + (v / qMaxX) * halfW; }
            function toY(v) { return cy - (v / qMaxY) * halfH; }

            ctx.save();

            // Neutraler Hintergrund aller 4 Quadranten
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(padL, padT, plotW, plotH);

            // I. Quadrant wird ERST hervorgehoben, wenn der Button eingeschaltet ist
            if (showOnlyRelevant) {
              ctx.fillStyle = 'rgba(52, 199, 89, 0.095)';
              ctx.fillRect(cx, padT, halfW, halfH);
            }

            // Feines Hilfsgitter über alle 4 Quadranten
            ctx.strokeStyle = 'rgba(60, 60, 67, 0.05)';
            ctx.lineWidth = 1;
            var gx, gy;
            for (gx = -qMaxX; gx <= qMaxX + 0.001; gx += qStepX / 2) {
              var pxFine = toX(gx);
              ctx.beginPath();
              ctx.moveTo(pxFine, padT);
              ctx.lineTo(pxFine, padT + plotH);
              ctx.stroke();
            }
            for (gy = -qMaxY; gy <= qMaxY + 0.001; gy += qStepY / 2) {
              var pyFine = toY(gy);
              ctx.beginPath();
              ctx.moveTo(padL, pyFine);
              ctx.lineTo(padL + plotW, pyFine);
              ctx.stroke();
            }

            // Hauptgitter über alle 4 Quadranten
            ctx.strokeStyle = 'rgba(60, 60, 67, 0.125)';
            for (gx = -qMaxX; gx <= qMaxX + 0.001; gx += qStepX) {
              var pxMaj = toX(gx);
              ctx.beginPath();
              ctx.moveTo(pxMaj, padT);
              ctx.lineTo(pxMaj, padT + plotH);
              ctx.stroke();
            }
            for (gy = -qMaxY; gy <= qMaxY + 0.001; gy += qStepY) {
              var pyMaj = toY(gy);
              ctx.beginPath();
              ctx.moveTo(padL, pyMaj);
              ctx.lineTo(padL + plotW, pyMaj);
              ctx.stroke();
            }

            // Mathematische Beschriftung der 4 Quadranten (komplett gleichberechtigt bei ausgeschaltetem Button)
            function drawQuadrantInfo(romanTitle, signText, roleText, qCenterX, qCenterY, isHighlighted) {
              ctx.save();
              var maxBoxW = halfW - (isPhone ? 10 : 18);
              var boxW = Math.max(76, Math.min(maxBoxW, isPhone ? 116 : (width < 560 ? 142 : 178)));
              var boxH = isPhone ? 36 : (width < 560 ? 44 : 52);
              var bx = qCenterX - boxW / 2;
              var by = qCenterY - boxH / 2;

              drawRoundedRect(ctx, bx, by, boxW, boxH, 8);
              ctx.fillStyle = isHighlighted ? 'rgba(255, 255, 255, 0.96)' : 'rgba(250, 250, 252, 0.93)';
              ctx.fill();
              ctx.strokeStyle = isHighlighted ? 'rgba(52, 199, 89, 0.62)' : 'rgba(60, 60, 67, 0.16)';
              ctx.lineWidth = isHighlighted ? 1.65 : 1.1;
              ctx.stroke();

              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              var titleLine = boxW < 108 ? romanTitle.replace(' Quadrant', ' Q.') : (romanTitle + (boxW < 135 ? '' : '  (' + signText + ')'));
              var subLine = boxW < 135 ? signText : roleText;

              ctx.font = (isPhone ? '700 9.4px' : (width < 560 ? '700 10.5px' : '700 11.8px')) + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
              ctx.fillStyle = isHighlighted ? '#1E7E34' : '#1C1C1E';
              ctx.fillText(titleLine, qCenterX, by + boxH * 0.36);

              ctx.font = (isPhone ? '500 8.3px' : (width < 560 ? '500 9.2px' : '500 10.2px')) + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
              ctx.fillStyle = isHighlighted ? '#0F5132' : '#6C6C70';
              ctx.fillText(subLine, qCenterX, by + boxH * 0.72);
              ctx.restore();
            }

            var qOffX = halfW * 0.52;
            var qTopY = padT + halfH * (isPhone ? 0.38 : 0.36);
            var qBotY = cy + halfH * (isPhone ? 0.60 : 0.62);

            drawQuadrantInfo('I. Quadrant', 'x > 0 | y > 0', 'Abszisse +, Ordinate +', cx + qOffX, qTopY, showOnlyRelevant);
            drawQuadrantInfo('II. Quadrant', 'x < 0 | y > 0', 'Abszisse \u2212, Ordinate +', cx - qOffX, qTopY, false);
            drawQuadrantInfo('III. Quadrant', 'x < 0 | y < 0', 'Abszisse \u2212, Ordinate \u2212', cx - qOffX, qBotY, false);
            drawQuadrantInfo('IV. Quadrant', 'x > 0 | y < 0', 'Abszisse +, Ordinate \u2212', cx + qOffX, qBotY, false);

            // STATISCHES HERVORHEBEN DES I. QUADRANTEN NUR BEI AKTIVIERTEM BUTTON
            if (showOnlyRelevant) {
              ctx.fillStyle = 'rgba(242, 242, 247, 0.78)';
              ctx.fillRect(padL, padT, halfW, halfH);
              ctx.fillRect(padL, cy, halfW, halfH);
              ctx.fillRect(cx, cy, halfW, halfH);

              ctx.save();
              if (!isPhone) {
                drawPillBadge(ctx, 'ausgeblendet: t < 0 (vor Start)', cx - qOffX, qTopY + 34, 'rgba(118, 118, 128, 0.20)', '#6C6C70');
                drawPillBadge(ctx, 'ausgeblendet: t < 0 und y < 0', cx - qOffX, qBotY - 34, 'rgba(118, 118, 128, 0.20)', '#6C6C70');
                drawPillBadge(ctx, 'ausgeblendet: y < 0 (' + theme.unitY + ' nicht negativ)', cx + qOffX, qBotY - 34, 'rgba(118, 118, 128, 0.20)', '#6C6C70');
              }

              ctx.strokeStyle = 'rgba(52, 199, 89, 0.88)';
              ctx.lineWidth = 2.4;
              ctx.strokeRect(cx + 1, padT + 1, halfW - 2, halfH - 2);

              var relBadge = isPhone ? '\u2713 I. Quadrant (x \u2265 0 | y \u2265 0)' : '\u2713 Relevanter Bereich: I. Quadrant (x \u2265 0 | y \u2265 0)';
              drawPillBadge(ctx, relBadge, cx + halfW * 0.5, padT + halfH * 0.74, '#34C759', '#FFFFFF');
              ctx.restore();
            }

            // Negative Halbachsen (bei ausgeschaltetem Button identisch scharf wie positive Halbachsen)
            var negAxisAlpha = (1 - 0.48 * fade).toFixed(2);
            ctx.strokeStyle = showOnlyRelevant ? ('rgba(28, 28, 30, ' + negAxisAlpha + ')') : '#1C1C1E';
            ctx.lineWidth = showOnlyRelevant ? 1.7 : (isPhone ? 1.75 : 2.0);
            ctx.beginPath();
            ctx.moveTo(padL - 3, cy);
            ctx.lineTo(cx, cy);
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx, padT + plotH + 3);
            ctx.stroke();

            // Positive Halbachsen + Pfeilspitzen
            ctx.strokeStyle = '#1C1C1E';
            ctx.fillStyle = '#1C1C1E';
            ctx.lineWidth = isPhone ? 1.75 : 2.0;

            var xPosEnd = padL + plotW + (isPhone ? 6 : 8);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(xPosEnd, cy);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(xPosEnd + 5.5, cy);
            ctx.lineTo(xPosEnd - 2, cy - 4.4);
            ctx.lineTo(xPosEnd - 2, cy + 4.4);
            ctx.closePath();
            ctx.fill();

            var yPosEnd = padT - (isPhone ? 6 : 8);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx, yPosEnd);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, yPosEnd - 5.5);
            ctx.lineTo(cx - 4.4, yPosEnd + 2);
            ctx.lineTo(cx + 4.4, yPosEnd + 2);
            ctx.closePath();
            ctx.fill();

            // Skalierung x-Achse (negativ + positiv, mit echtem Minuszeichen)
            ctx.font = (isPhone ? '600 9.4px' : '600 10.6px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (gx = -qMaxX; gx <= qMaxX + 0.001; gx += qStepX) {
              if (Math.abs(gx) < 0.001) continue;
              var txPx = toX(gx);
              var dimX = gx < 0 && showOnlyRelevant;
              ctx.strokeStyle = dimX ? ('rgba(60, 60, 67, ' + negAxisAlpha + ')') : '#1C1C1E';
              ctx.fillStyle = dimX ? ('rgba(108, 108, 112, ' + negAxisAlpha + ')') : '#3A3A3C';
              ctx.lineWidth = 1.35;
              ctx.beginPath();
              ctx.moveTo(txPx, cy - 3.2);
              ctx.lineTo(txPx, cy + 4.2);
              ctx.stroke();
              ctx.fillText(Formatters.formatNumber(gx, 0), txPx, cy + (isPhone ? 5.5 : 7));
            }

            // Skalierung y-Achse (negativ + positiv)
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (gy = -qMaxY; gy <= qMaxY + 0.001; gy += qStepY) {
              if (Math.abs(gy) < 0.001) continue;
              var tyPx = toY(gy);
              var dimY = gy < 0 && showOnlyRelevant;
              ctx.strokeStyle = dimY ? ('rgba(60, 60, 67, ' + negAxisAlpha + ')') : '#1C1C1E';
              ctx.fillStyle = dimY ? ('rgba(108, 108, 112, ' + negAxisAlpha + ')') : '#3A3A3C';
              ctx.lineWidth = 1.35;
              ctx.beginPath();
              ctx.moveTo(cx - 4.2, tyPx);
              ctx.lineTo(cx + 3.2, tyPx);
              ctx.stroke();
              ctx.fillText(Formatters.formatNumber(gy, 0), cx - (isPhone ? 5.5 : 7), tyPx);
            }

            // Ursprungs-Beschriftung O(0 | 0)
            ctx.fillStyle = '#1C1C1E';
            ctx.font = (isPhone ? '700 9.4px' : '700 10.5px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText('O(0|0)', cx - 5, cy + 5);

            // Mathematische + anschauliche Achsentitel (Smartphone-angepasst)
            ctx.fillStyle = '#1C1C1E';
            ctx.font = (isPhone ? '700 9.4px' : (width < 520 ? '700 10.4px' : '700 11.6px')) + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            var xAxisCaption = isPhone
              ? ('+x: Abszissenachse (' + theme.unitX + ')')
              : (width < 540
                  ? ('+x: Rechtsachse / Abszissenachse (' + theme.unitX + ')')
                  : ('+x: Rechtsachse / Abszissenachse (' + theme.shortAxisX + ')'));
            ctx.fillText(xAxisCaption, padL + plotW + 2, cy - (isPhone ? 7 : 9));

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            var yAxisCaption = isPhone
              ? ('+y: Ordinatenachse (' + theme.unitY + ')')
              : (width < 540
                  ? ('+y: Hochachse / Ordinatenachse (' + theme.unitY + ')')
                  : ('+y: Hochachse / Ordinatenachse (' + theme.shortAxisY + ')'));
            ctx.fillText(yAxisCaption, cx, isPhone ? 4 : 6);

            // RUHIGE STATISCHE FOKUS-MARKIERUNGEN FÜR DAS KLASSENPLENUM
            var focusBadgeY = height - (isPhone ? 12 : 15);
            if (focusMode === 'all-quadrants') {
              var arcR = Math.min(halfW, halfH) * 0.27;
              var endAngle = -Math.PI * 1.72;
              ctx.save();
              ctx.setLineDash([5, 4]);
              ctx.strokeStyle = 'rgba(0, 122, 255, 0.72)';
              ctx.lineWidth = 1.9;
              ctx.beginPath();
              ctx.arc(cx, cy, arcR, -0.35, endAngle, true);
              ctx.stroke();
              ctx.setLineDash([]);

              var tipX = cx + arcR * Math.cos(endAngle);
              var tipY = cy + arcR * Math.sin(endAngle);
              var tangAngle = endAngle - Math.PI / 2;
              ctx.beginPath();
              ctx.moveTo(tipX, tipY);
              ctx.lineTo(tipX - 7.5 * Math.cos(tangAngle - 0.48), tipY - 7.5 * Math.sin(tangAngle - 0.48));
              ctx.lineTo(tipX - 7.5 * Math.cos(tangAngle + 0.48), tipY - 7.5 * Math.sin(tangAngle + 0.48));
              ctx.closePath();
              ctx.fillStyle = '#007AFF';
              ctx.fill();

              drawPillBadge(ctx, isPhone ? '\u21BA Gegen Uhrzeigersinn: I \u2192 II \u2192 III \u2192 IV' : '\u21BA Nummerierung gegen den Uhrzeigersinn: I \u2192 II \u2192 III \u2192 IV', cx, focusBadgeY, '#007AFF', '#FFFFFF');
              ctx.restore();
            } else if (focusMode === 'xaxis') {
              ctx.save();
              ctx.strokeStyle = '#007AFF';
              ctx.lineWidth = 3.8;
              ctx.beginPath();
              ctx.moveTo(padL, cy);
              ctx.lineTo(xPosEnd, cy);
              ctx.stroke();
              drawPillBadge(ctx, isPhone ? '\u23F1 x-Achse (Abszisse): Unabh\u00e4ngige Zeit t' : '\u23F1 x-Achse / Abszissenachse (Rechtsachse): Unabh\u00e4ngige Variable Zeit t', cx, focusBadgeY, '#007AFF', '#FFFFFF');
              ctx.restore();
            } else if (focusMode === 'yaxis') {
              ctx.save();
              ctx.strokeStyle = '#FF9500';
              ctx.lineWidth = 3.8;
              ctx.beginPath();
              ctx.moveTo(cx, padT + plotH);
              ctx.lineTo(cx, yPosEnd);
              ctx.stroke();
              drawPillBadge(ctx, isPhone ? '\uD83D\uDCCA y-Achse (Ordinate): Abh\u00e4ngiger Wert (' + theme.unitY + ')' : '\uD83D\uDCCA y-Achse / Ordinatenachse (Hochachse): Abh\u00e4ngiger Funktionswert (' + theme.unitY + ')', cx, focusBadgeY, '#FF9500', '#FFFFFF');
              ctx.restore();
            } else if (focusMode === 'scale') {
              ctx.save();
              var jumpCount = Math.max(1, Math.floor(qMaxX / qStepX));
              ctx.strokeStyle = '#34C759';
              ctx.lineWidth = 2.2;
              for (var j = 0; j < jumpCount; j++) {
                var sx1 = toX(j * qStepX);
                var sx2 = toX((j + 1) * qStepX);
                ctx.beginPath();
                ctx.moveTo(sx1, cy);
                ctx.quadraticCurveTo((sx1 + sx2) / 2, cy - (isPhone ? 14 : 19), sx2, cy);
                ctx.stroke();
              }
              drawPillBadge(ctx, isPhone ? '\uD83D\uDCCF Gleiche Abst\u00e4nde = +' + qStepX + ' ' + theme.unitX : '\uD83D\uDCCF \u00c4quidistante Achseneinteilung: Gleiche Abst\u00e4nde = gleiche Werteschritte (+' + qStepX + ' ' + theme.unitX + ')', cx, focusBadgeY, '#34C759', '#FFFFFF');
              ctx.restore();
            } else if (focusMode === 'origin') {
              ctx.save();
              ctx.beginPath();
              ctx.arc(cx, cy, isPhone ? 13 : 16, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(175, 82, 222, 0.16)';
              ctx.fill();
              ctx.strokeStyle = 'rgba(175, 82, 222, 0.55)';
              ctx.lineWidth = 2;
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(cx, cy, isPhone ? 5.8 : 7, 0, Math.PI * 2);
              ctx.fillStyle = '#AF52DE';
              ctx.fill();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2;
              ctx.stroke();

              drawPillBadge(ctx, isPhone ? '\uD83C\uDFAF Ursprung O(0 | 0): Achsenschnittpunkt' : '\uD83C\uDFAF Koordinatenursprung O(0 | 0): Orthogonaler Schnittpunkt von Abszissen- & Ordinatenachse', cx, focusBadgeY, '#AF52DE', '#FFFFFF');
              ctx.restore();
            }

            ctx.restore();
          },

          /* 2A. PHASE 1 SEITE 1: ACHSEN-EINFLUSS RECHTS NEBEN DEN SCHIEBEREGLERN ENTDECKEN */
          renderPhase1ExploreGraph: function (canvas, theme, p1State) {
            var g = prepareGraphCanvas(canvas, theme);
            if (!g) return;
            drawCoordinateGrid(g, theme);

            var ctx = g.ctx;
            var exX = Math.max(0, Math.min(theme.maxX, p1State.freeT));
            var exY = Math.max(0, Math.min(theme.maxY, p1State.exploreY));
            var px = g.toPxX(exX);
            var py = g.toPxY(exY);
            var xAxisY = g.toPxY(0);
            var yAxisX = g.toPxX(0);

            ctx.save();

            // Vertikale Hilfslinie von der x-Achse (Abszissenachse) nach oben
            ctx.setLineDash([5, 4]);
            ctx.strokeStyle = 'rgba(0, 122, 255, 0.62)';
            ctx.lineWidth = 1.75;
            ctx.beginPath();
            ctx.moveTo(px, g.padTop);
            ctx.lineTo(px, xAxisY);
            ctx.stroke();

            // Horizontale Hilfslinie von der y-Achse (Ordinatenachse) nach rechts
            ctx.strokeStyle = 'rgba(255, 149, 0, 0.62)';
            ctx.lineWidth = 1.75;
            ctx.beginPath();
            ctx.moveTo(yAxisX, py);
            ctx.lineTo(g.padLeft + g.plotW, py);
            ctx.stroke();
            ctx.setLineDash([]);

            // Schnittpunkt-Orientierungspunkt im Feld (dezent)
            ctx.beginPath();
            ctx.arc(px, py, g.isCompact ? 4 : 4.6, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = 'rgba(28, 28, 30, 0.45)';
            ctx.stroke();

            // Positions-Marke direkt auf der x-Achse (Abszisse x)
            ctx.beginPath();
            ctx.arc(px, xAxisY, g.isCompact ? 9.5 : 11, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 122, 255, 0.16)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(px, xAxisY, g.isCompact ? 5.2 : 6, 0, Math.PI * 2);
            ctx.fillStyle = '#007AFF';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#FFFFFF';
            ctx.stroke();

            // Positions-Marke direkt auf der y-Achse (Ordinate y)
            ctx.beginPath();
            ctx.arc(yAxisX, py, g.isCompact ? 9.5 : 11, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 149, 0, 0.18)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(yAxisX, py, g.isCompact ? 5.2 : 6, 0, Math.PI * 2);
            ctx.fillStyle = '#FF9500';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#FFFFFF';
            ctx.stroke();

            // Kollisionsfreie Badges für beide Achsen-Positionen
            var xText = (g.isCompact ? 'x = ' : 'Abszisse x = ') + Formatters.formatNumber(exX, 1) + ' ' + theme.unitX;
            var yText = (g.isCompact ? 'y = ' : 'Ordinate y = ') + Formatters.formatNumber(exY, 0) + ' ' + theme.unitY;

            drawPillBadge(ctx, xText, px, xAxisY - (g.isCompact ? 15 : 18), '#007AFF', '#FFFFFF');

            var yBadgeY = Math.min(xAxisY - (g.isCompact ? 36 : 42), Math.max(g.padTop + 16, py));
            drawPillBadge(ctx, yText, yAxisX + (g.isCompact ? 50 : 68), yBadgeY, '#FF9500', '#FFFFFF');

            ctx.restore();
          },

          /* 2B. PHASE 1 SEITE 2: KOORDINATEN-FADENKREUZ & FIXIERTE PUNKTE (SMARTPHONE-OPTIMIERT) */
          renderPhase1Plot: function (canvas, theme, p1State) {
            var g = prepareGraphCanvas(canvas, theme);
            if (!g) return;
            drawCoordinateGrid(g, theme);

            var pts = theme.points;
            var fixed = p1State.fixedIndices;
            var ctx = g.ctx;

            // Fixierte Punkte zeichnen (randgesicherte Beschriftung für Pool & Netflix)
            for (var i = 0; i < fixed.length; i++) {
              var p = pts[fixed[i]];
              if (!p) continue;
              var px = g.toPxX(p.t);
              var py = g.toPxY(p.y);

              if (p1State.lastLockedIndex === p.index) {
                ctx.beginPath();
                ctx.arc(px, py, g.isCompact ? 10.5 : 12.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(52, 199, 89, 0.22)';
                ctx.fill();
              }

              ctx.beginPath();
              ctx.arc(px, py, g.isCompact ? 5.6 : 6.5, 0, Math.PI * 2);
              ctx.fillStyle = '#34C759';
              ctx.fill();
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#FFFFFF';
              ctx.stroke();

              ctx.fillStyle = '#1E7E34';
              ctx.font = (g.isCompact ? '700 9.6px' : '700 10.8px') + ' -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif';
              var nearRight = px > g.padLeft + g.plotW - (g.isCompact ? 62 : 72);
              var nearTop = py < g.padTop + 18;
              ctx.textAlign = nearRight ? 'right' : 'left';
              ctx.textBaseline = nearTop ? 'top' : 'bottom';
              ctx.fillText(
                'P(' + p.t + '|' + p.y + ')',
                nearRight ? px - 8 : px + 8,
                nearTop ? py + 6 : py - 5
              );
            }

            // Aktives Fadenkreuz
            var cx = g.toPxX(p1State.x);
            var cy = g.toPxY(p1State.y);

            ctx.save();
            ctx.setLineDash([5, 4]);
            ctx.strokeStyle = '#007AFF';
            ctx.lineWidth = 1.65;

            ctx.beginPath();
            ctx.moveTo(cx, g.padTop);
            ctx.lineTo(cx, g.toPxY(0));
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(g.toPxX(0), cy);
            ctx.lineTo(g.padLeft + g.plotW, cy);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(cx, cy, g.isCompact ? 9.5 : 10.5, 0, Math.PI * 2);
            ctx.strokeStyle = '#007AFF';
            ctx.lineWidth = 2.1;
            ctx.fillStyle = 'rgba(0, 122, 255, 0.14)';
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 3.3, 0, Math.PI * 2);
            ctx.fillStyle = '#007AFF';
            ctx.fill();

            var labelText = 'P(' + Formatters.formatNumber(p1State.x, 1) + ' | ' + Formatters.formatNumber(p1State.y, 1) + ')';
            var badgeY = cy < g.padTop + 32 ? cy + 22 : cy - 20;
            drawPillBadge(ctx, labelText, cx + (cx > g.padLeft + g.plotW * 0.68 ? -42 : 42), badgeY, '#007AFF', '#FFFFFF');

            ctx.restore();
          },

          /* 3. PHASE 2: MESSPUNKTDICHTE-SCANNER & STETIGKEIT (MODERN & KLAR) */
          renderPhase2: function (canvas, theme, density) {
            var g = prepareGraphCanvas(canvas, theme);
            if (!g) return;
            drawCoordinateGrid(g, theme);

            var ctx = g.ctx;
            var d = Math.max(0, Math.min(100, density));
            var isPool = theme.id === 'pool';

            var baseStep = isPool ? 5 : 2;
            var maxT = isPool ? 25 : 12;
            var dt = baseStep * Math.pow(0.018, d / 100);

            // Durchgehender Funktionsgraph ab hoher Dichte
            if (d >= 80) {
              var lineAlpha = Math.min(1, (d - 80) / 15);
              ctx.save();
              ctx.strokeStyle = 'rgba(0, 122, 255, ' + (lineAlpha * 0.18).toFixed(2) + ')';
              ctx.lineWidth = g.isCompact ? 7.5 : 9;
              ctx.lineCap = 'round';
              ctx.beginPath();
              if (isPool) {
                ctx.moveTo(g.toPxX(0), g.toPxY(100));
                ctx.lineTo(g.toPxX(25), g.toPxY(0));
              } else {
                ctx.moveTo(g.toPxX(0), g.toPxY(0));
                ctx.lineTo(g.toPxX(12), g.toPxY(180));
              }
              ctx.stroke();

              ctx.strokeStyle = d >= 95
                ? 'rgba(52, 199, 89, ' + lineAlpha.toFixed(2) + ')'
                : 'rgba(0, 122, 255, ' + lineAlpha.toFixed(2) + ')';
              ctx.lineWidth = g.isCompact ? 3.2 : 3.8;
              ctx.stroke();
              ctx.restore();
            }

            // Zwischenmesspunkte zeichnen
            if (d < 96) {
              var dotRadius = d < 35 ? (g.isCompact ? 3.8 : 4.5) : (d < 70 ? 3.1 : 2.2);
              ctx.fillStyle = '#007AFF';
              for (var t = 0; t <= maxT + 0.001; t += dt) {
                var yVal = isPool ? 100 - 4 * t : 15 * t;
                ctx.beginPath();
                ctx.arc(g.toPxX(t), g.toPxY(yVal), dotRadius, 0, Math.PI * 2);
                ctx.fill();
              }
            }

            // Ursprüngliche Messpunkte aus Phase 1 als Anker
            for (var i = 0; i < theme.points.length; i++) {
              var pt = theme.points[i];
              var mx = g.toPxX(pt.t);
              var my = g.toPxY(pt.y);
              ctx.beginPath();
              ctx.arc(mx, my, g.isCompact ? 5 : 5.8, 0, Math.PI * 2);
              ctx.fillStyle = d >= 95 ? '#34C759' : '#007AFF';
              ctx.fill();
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#FFFFFF';
              ctx.stroke();
            }
          },

          /* 4. PHASE 3: PROZESS-ZUSTANDS-INSPEKTOR (SMARTPHONE- & RETINA-OPTIMIERT) */
          renderPhase3: function (canvas, theme, p3State) {
            var g = prepareGraphCanvas(canvas, theme);
            if (!g) return;
            drawCoordinateGrid(g, theme);

            var ctx = g.ctx;
            var isPool = theme.id === 'pool';
            var maxT = isPool ? 25 : 12;
            var t = Math.max(0, Math.min(maxT, p3State.probeT));
            var yVal = isPool ? 100 - 4 * t : 15 * t;

            ctx.save();

            // Farbige Fortschrittsfläche unter dem bisher durchlaufenen Zeitabschnitt [0, t]
            if (t > 0.05) {
              var startVal = isPool ? 100 : 0;
              var areaGrad = ctx.createLinearGradient(g.toPxX(0), 0, g.toPxX(t), 0);
              areaGrad.addColorStop(0, 'rgba(0, 122, 255, 0.14)');
              areaGrad.addColorStop(1, 'rgba(0, 122, 255, 0.04)');
              ctx.fillStyle = areaGrad;
              ctx.beginPath();
              ctx.moveTo(g.toPxX(0), g.toPxY(0));
              ctx.lineTo(g.toPxX(0), g.toPxY(startVal));
              ctx.lineTo(g.toPxX(t), g.toPxY(yVal));
              ctx.lineTo(g.toPxX(t), g.toPxY(0));
              ctx.closePath();
              ctx.fill();
            }

            // Durchgehender Funktionsgraph
            ctx.strokeStyle = '#007AFF';
            ctx.lineWidth = g.isCompact ? 3.2 : 3.6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            if (isPool) {
              ctx.moveTo(g.toPxX(0), g.toPxY(100));
              ctx.lineTo(g.toPxX(25), g.toPxY(0));
            } else {
              ctx.moveTo(g.toPxX(0), g.toPxY(0));
              ctx.lineTo(g.toPxX(12), g.toPxY(180));
            }
            ctx.stroke();

            // Ankerpunkte
            for (var i = 0; i < theme.points.length; i++) {
              var pt = theme.points[i];
              ctx.beginPath();
              ctx.arc(g.toPxX(pt.t), g.toPxY(pt.y), g.isCompact ? 3.6 : 4.2, 0, Math.PI * 2);
              ctx.fillStyle = '#FFFFFF';
              ctx.fill();
              ctx.lineWidth = 1.9;
              ctx.strokeStyle = '#007AFF';
              ctx.stroke();
            }

            // 1. Statischer Verlaufspfeil (Monotonieverhalten)
            if (p3State.step1Done) {
              var ax1 = g.toPxX(isPool ? 6.5 : 3);
              var ay1 = g.toPxY(isPool ? 74 : 45) - (g.isCompact ? 15 : 20);
              var ax2 = g.toPxX(isPool ? 17 : 8.5);
              var ay2 = g.toPxY(isPool ? 32 : 127.5) - (g.isCompact ? 15 : 20);

              ctx.strokeStyle = '#007AFF';
              ctx.lineWidth = 2.3;
              ctx.beginPath();
              ctx.moveTo(ax1, ay1);
              ctx.lineTo(ax2, ay2);
              ctx.stroke();

              var angle = Math.atan2(ay2 - ay1, ax2 - ax1);
              ctx.beginPath();
              ctx.moveTo(ax2, ay2);
              ctx.lineTo(ax2 - 9 * Math.cos(angle - 0.45), ay2 - 9 * Math.sin(angle - 0.45));
              ctx.lineTo(ax2 - 9 * Math.cos(angle + 0.45), ay2 - 9 * Math.sin(angle + 0.45));
              ctx.closePath();
              ctx.fillStyle = '#007AFF';
              ctx.fill();

              var vText = isPool ? 'Streng monoton fallend' : 'Streng monoton steigend';
              drawPillBadge(ctx, vText, (ax1 + ax2) / 2 + 8, (ay1 + ay2) / 2 - 14, 'rgba(0, 122, 255, 0.14)', '#0055D4');
            }

            var showStart = p3State.step2Done || Math.abs(t) < 0.25;
            var showZero = p3State.step3Done || (isPool ? Math.abs(t - 25) < 0.25 : Math.abs(t) < 0.25);
            var bothAtOrigin = !isPool && showStart && showZero;

            // 2. y-Achsenabschnitt / Ordinatenabschnitt Sy(0 | y0)
            if (showStart) {
              var startY = isPool ? 100 : 0;
              var sx = g.toPxX(0);
              var sy = g.toPxY(startY);

              ctx.beginPath();
              ctx.arc(sx, sy, g.isCompact ? 11 : 13, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(52, 199, 89, 0.24)';
              ctx.fill();

              ctx.beginPath();
              ctx.arc(sx, sy, g.isCompact ? 6 : 7, 0, Math.PI * 2);
              ctx.fillStyle = '#34C759';
              ctx.fill();
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#FFFFFF';
              ctx.stroke();

              var startBadgeY = bothAtOrigin ? sy - (g.isCompact ? 42 : 46) : sy - 15;
              var startText = g.isCompact ? ('Sy(0|' + startY + ') Startwert') : ('Sy(0 | ' + startY + ') \u00b7 y-Achsenabschnitt');
              drawPillBadge(ctx, startText, sx + (g.isCompact ? 68 : 96), startBadgeY, '#34C759', '#FFFFFF');
            }

            // 3. Nullstelle / Achsenschnittpunkt N(x0 | 0)
            if (showZero) {
              var zeroX = isPool ? 25 : 0;
              var nx = g.toPxX(zeroX);
              var ny = g.toPxY(0);

              ctx.beginPath();
              ctx.arc(nx, ny, bothAtOrigin ? 10 : (g.isCompact ? 11 : 13), 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(255, 149, 0, 0.24)';
              ctx.fill();

              ctx.beginPath();
              ctx.arc(nx, ny, bothAtOrigin ? 5 : (g.isCompact ? 6 : 7), 0, Math.PI * 2);
              ctx.fillStyle = '#FF9500';
              ctx.fill();
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#FFFFFF';
              ctx.stroke();

              var zeroBadgeX = isPool ? nx - 40 : nx + (g.isCompact ? 64 : 88);
              var zeroBadgeY = bothAtOrigin ? ny - 18 : ny - 22;
              var zeroText = g.isCompact ? ('N(' + zeroX + '|0) Nullstelle') : ('N(' + zeroX + ' | 0) \u00b7 Nullstelle');
              drawPillBadge(ctx, zeroText, zeroBadgeX, zeroBadgeY, '#FF9500', '#FFFFFF');
            }

            // 4. Bewegliche Zeit-Sonde P(t | y)
            var px = g.toPxX(t);
            var py = g.toPxY(yVal);

            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(28, 28, 30, 0.45)';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px, g.toPxY(0));
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(g.toPxX(0), py);
            ctx.lineTo(px, py);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(px, py, g.isCompact ? 11.5 : 13, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(28, 28, 30, 0.13)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(px, py, g.isCompact ? 7.2 : 8.2, 0, Math.PI * 2);
            ctx.fillStyle = '#1C1C1E';
            ctx.fill();
            ctx.lineWidth = 2.4;
            ctx.strokeStyle = '#FFFFFF';
            ctx.stroke();

            var probeLabel = 'Sonde P(' + Formatters.formatNumber(t, 1) + ' | ' + Formatters.formatNumber(yVal, 1) + ')';
            var pBadgeY = py > g.padTop + 52 ? py - 24 : py + 24;
            if (bothAtOrigin && t < 2.2) {
              pBadgeY = py - (g.isCompact ? 66 : 74);
            }
            drawPillBadge(ctx, probeLabel, px, pBadgeY, '#1C1C1E', '#FFFFFF');

            ctx.restore();
          }
        };
      })();

      /* ======================================================================

        function buildABAndMerkblattHTML(phaseId, showNextPhaseButton) {

        /* --------------------------------------------------------------------
           OBERFLÄCHE 2B: ADVANCE ORGANIZER HUB
           -------------------------------------------------------------------- */
        function renderDiscoveryHub() {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var cardsHTML = '';

          for (var i = 0; i < AppData.PHASES.length; i++) {
            var p = AppData.PHASES[i];
            var unlocked = StateStore.isUnlocked(p.id);
            var done = !!thSt.completed[p.id];

            var stateClass = done ? 'is-unlocked is-completed' : (unlocked ? 'is-unlocked' : 'is-locked');
            var topRightBadge = done
              ? '<span class="solved-check-circle" title="Vollständig gelöst" aria-label="Gelöst">&#10003;</span>'
              : (unlocked ? '' : '<span class="locked-icon-circle" title="Noch gesperrt" aria-label="Gesperrt">&#128274;</span>');

            var primaryBtn = unlocked
              ? '<button type="button" class="ios-btn ' + (done ? 'ios-btn-tinted' : 'ios-btn-primary') + '" data-action="open-phase" data-phase="' + p.id + '">' +
                  (done ? 'Phase ' + p.id + ' erneut öffnen' : 'Phase ' + p.id + ' starten &rarr;') +
                '</button>'
              : '<button type="button" class="ios-btn ios-btn-secondary" disabled>' +
                  'Gesperrt &ndash; erst Phase ' + (p.id - 1) + ' lösen' +
                '</button>';

            var merkblattBtn = done
              ? '<button type="button" class="ios-btn ios-btn-secondary ios-btn-sm" data-action="toggle-merkblatt" data-phase="' + p.id + '">' +
                  (thSt.merkblattOpen[p.id] ? 'Merkblatt ' + p.id + ' ausblenden' : 'Merkblatt ' + p.id + ' anzeigen') +
                '</button>'
              : '';

            cardsHTML +=
              '<article class="phase-hub-card ' + stateClass + '">' +
                '<div>' +
                  '<div class="phase-card-top">' +
                    '<span class="phase-number-pill">' +
                      (done ? '&#10003; Gelöst' : (unlocked ? 'Jetzt aktiv' : 'Gesperrt')) +
                    '</span>' +
                    topRightBadge +
                  '</div>' +
                  '<h3 class="phase-hub-title">' + Formatters.escapeHTML(p.shortTitle) + '</h3>' +
                  '<p class="phase-hub-tool">' + Formatters.escapeHTML(p.toolName) + '</p>' +
                  '<p class="phase-hub-desc">' + Formatters.escapeHTML(p.summary) + '</p>' +
                '</div>' +
                '<div class="phase-hub-actions">' +
                  primaryBtn +
                  merkblattBtn +
                '</div>' +
              '</article>';
          }

          var unlockedSummariesHTML = '';
          for (var phaseIdx = 1; phaseIdx <= 3; phaseIdx++) {
            if (thSt.completed[phaseIdx] && thSt.merkblattOpen[phaseIdx]) {
              unlockedSummariesHTML += buildABAndMerkblattHTML(phaseIdx, false);
            }
          }

          mainEl.innerHTML =
            '<section class="ios-card">' +
              '<span class="section-eyebrow">Entdeckungsbereich &middot; Advance Organizer (' + theme.icon + ' ' + Formatters.escapeHTML(theme.name) + ')</span>' +
              '<h2 class="card-title">Vom Realphänomen zur mathematischen Funktionsanalyse</h2>' +
              '<p class="card-subtitle">' +
                'Arbeite die drei Phasen im <strong>I.&nbsp;Quadranten des kartesischen Koordinatensystems</strong> nacheinander durch. Jede vollständig gelöste Phase schaltet die nächste Stufe, dein Merkblatt und den Auftrag für <strong>Arbeitsblatt&nbsp;2</strong> frei.' +
              '</p>' +
              buildDataTableHTML(true) +
              '<div class="phases-grid">' +
                cardsHTML +
              '</div>' +
              unlockedSummariesHTML +
            '</section>';
        }

        function buildWorkspaceTopbar(activePhaseId) {
          var thSt = StateStore.getCurrentThemeState();
          var pills = '';
          for (var id = 1; id <= 3; id++) {
            var unlocked = StateStore.isUnlocked(id);
            var done = !!thSt.completed[id];
            var cls = 'stepper-pill' + (id === activePhaseId ? ' is-current' : '') + (done ? ' is-done' : '');
            pills +=
              '<button type="button" class="' + cls + '" data-action="open-phase" data-phase="' + id + '"' + (unlocked ? '' : ' disabled') + '>' +
                'Phase ' + id + (done ? ' &#10003;' : (unlocked ? '' : ' &#128274;')) +
              '</button>';
          }

          return (
