        function updatePhase1FeedbackDOM() {
          var box = document.getElementById('p1-feedback-box');
          if (!box) return;
          if (!p1FeedbackState) {
            box.hidden = true;
            return;
          }
          box.hidden = false;
          box.className = 'feedback-banner ' + (p1FeedbackState.type === 'success' ? 'feedback-success' : 'feedback-hint');
          box.innerHTML =
            '<span class="feedback-icon">' + (p1FeedbackState.type === 'success' ? '&#10003;' : '&#128161;') + '</span>' +
            '<div>' + Formatters.escapeHTML(p1FeedbackState.text) + '</div>';
        }

        function syncPhase1DOMAfterPointLock(newlyLockedPoint) {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var p1 = thSt.phase1;

          var valX = document.getElementById('val-p1-x');
          var valY = document.getElementById('val-p1-y');
          var coordPill = document.getElementById('p1-coord-pill');
          var counterText = document.getElementById('p1-counter-text');
          var sliderX = document.getElementById('slider-p1-x');
          var sliderY = document.getElementById('slider-p1-y');
          var meaningSlot = document.getElementById('p1-real-meaning-slot');

          if (valX) valX.textContent = 'x = ' + Formatters.formatNumber(p1.x, 1) + ' ' + theme.unitX;
          if (valY) valY.textContent = 'y = ' + Formatters.formatNumber(p1.y, 1) + ' ' + theme.unitY;
          if (coordPill) coordPill.textContent = 'P(' + Formatters.formatNumber(p1.x, 1) + ' | ' + Formatters.formatNumber(p1.y, 1) + ')';
          if (counterText) counterText.textContent = '(' + p1.fixedIndices.length + ' von ' + theme.points.length + ' fixiert)';

          if (newlyLockedPoint) {
            if (sliderX) sliderX.value = String(newlyLockedPoint.t);
            if (sliderY) sliderY.value = String(newlyLockedPoint.y);

            var chip = document.querySelector('[data-point-chip="' + newlyLockedPoint.index + '"]');
            if (chip) {
              chip.classList.add('is-fixed');
              chip.setAttribute('data-action', 'inspect-point');
              chip.setAttribute('data-point-index', String(newlyLockedPoint.index));
              chip.style.cursor = 'pointer';
              chip.title = 'Klicken, um dieses geordnete Wertepaar in der Szene anzuzeigen';
              chip.innerHTML = '&#10003; P(' + newlyLockedPoint.t + ' | ' + newlyLockedPoint.y + ')';
            }

            var tdT = document.querySelector('[data-col-t="' + newlyLockedPoint.index + '"]');
            var tdY = document.querySelector('[data-col-y="' + newlyLockedPoint.index + '"]');
            if (tdT) {
              tdT.classList.add('is-point-fixed');
              tdT.innerHTML = newlyLockedPoint.t + '<span class="table-check-badge">&#10003;</span>';
            }
            if (tdY) tdY.classList.add('is-point-fixed');
          }

          if (meaningSlot) {
            meaningSlot.innerHTML = buildRealMeaningCardHTML(theme, p1);
          }

          if (p1.fixedIndices.length === theme.points.length && !thSt.completed[1]) {
            thSt.completed[1] = true;
            thSt.merkblattOpen[1] = true;
            StateStore.save();
            renderHeader();

            p1FeedbackState = {
              type: 'success',
              text: 'Großartig! Alle geordneten Wertepaare P(x | y) sind im I. Quadranten verortet. Phase 2 und Merkblatt 1 sind jetzt freigeschaltet.'
            };

            var slot = document.getElementById('p1-completion-slot');
            if (slot) slot.innerHTML = buildABAndMerkblattHTML(1, true);
            var topbar = document.querySelector('.workspace-topbar');
            if (topbar) topbar.outerHTML = buildWorkspaceTopbar(1);
          }

          updatePhase1FeedbackDOM();
          redrawActiveCanvas();
        }

        function trySnapAndLockPhase1(isExplicitCheck) {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var p1 = thSt.phase1;
          var res = Evaluators.checkPhase1Coordinate(theme, p1.x, p1.y);

          if (res.matched) {
            var pt = res.point;
            var already = p1.fixedIndices.indexOf(pt.index) !== -1;

            if (already && !isExplicitCheck) return;

            p1.x = pt.t;
            p1.y = pt.y;
            p1.lastLockedIndex = pt.index;

            if (!already) {
              p1.fixedIndices.push(pt.index);
              p1FeedbackState = {
                type: 'success',
                text: 'Eingerastet! Geordnetes Wertepaar P(' + pt.t + ' | ' + pt.y + ') fixiert: ' + pt.realNote
              };
            } else if (isExplicitCheck) {
              p1FeedbackState = {
                type: 'success',
                text: 'Wertepaar P(' + pt.t + ' | ' + pt.y + ') ist bereits fest eingetragen: ' + pt.realNote
              };
            }

            StateStore.save();
            syncPhase1DOMAfterPointLock(pt);
            return;
          }

          if (isExplicitCheck) {
            p1FeedbackState = { type: 'hint', text: res.message };
            updatePhase1FeedbackDOM();
            redrawActiveCanvas();
          }
        }

        function bindPhase1Events() {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var canvas = document.getElementById('phase1-canvas');
          var maxDomainT = theme.id === 'pool' ? 25 : 12;
          var maxProbeY = theme.id === 'pool' ? 100 : 180;

          // Seite 1: Zwei freie Achsen-Schieberegler (x-Achse / Abszisse vs. y-Achse / Ordinate)
          var freeSlider = document.getElementById('slider-p1-free-t');
          var freeValBadge = document.getElementById('val-p1-free-t');
          var exploreYSlider = document.getElementById('slider-p1-explore-y');
          var exploreYBadge = document.getElementById('val-p1-explore-y');
          var exploreHint = document.getElementById('p1-explore-live-hint');

          if (freeSlider) {
            freeSlider.addEventListener('input', function () {
              var val = parseFloat(freeSlider.value);
              thSt.phase1.freeT = val;
              thSt.phase1.lastExploreMoved = 't';
              if (freeValBadge) freeValBadge.textContent = 'x = ' + Formatters.formatNumber(val, 1) + ' ' + theme.unitX;
              if (exploreHint) {
                exploreHint.innerHTML = '<span class="feedback-icon">&#128161;</span><div>' + buildPhase1ExploreHintHTML(theme, thSt.phase1) + '</div>';
              }
              StateStore.save();
              redrawActiveCanvas();
            });
          }

          if (exploreYSlider) {
            exploreYSlider.addEventListener('input', function () {
              var yVal = parseFloat(exploreYSlider.value);
              thSt.phase1.exploreY = yVal;
              thSt.phase1.lastExploreMoved = 'y';
              if (exploreYBadge) exploreYBadge.textContent = 'y = ' + Formatters.formatNumber(yVal, 0) + ' ' + theme.unitY;
              if (exploreHint) {
                exploreHint.innerHTML = '<span class="feedback-icon">&#128161;</span><div>' + buildPhase1ExploreHintHTML(theme, thSt.phase1) + '</div>';
              }
              StateStore.save();
              redrawActiveCanvas();
            });
          }

          // Seite 2: Fadenkreuz-Regler für die Wertetabelle
          var sliderX = document.getElementById('slider-p1-x');
          var sliderY = document.getElementById('slider-p1-y');
          var checkBtn = document.getElementById('btn-p1-check-pos');

          function onPlotInput() {
            thSt.phase1.x = parseFloat(sliderX.value);
            thSt.phase1.y = parseFloat(sliderY.value);
            syncPhase1DOMAfterPointLock(null);
            trySnapAndLockPhase1(false);
            StateStore.save();
            redrawActiveCanvas();
          }

          if (sliderX) sliderX.addEventListener('input', onPlotInput);
          if (sliderY) sliderY.addEventListener('input', onPlotInput);
          if (checkBtn) {
            checkBtn.addEventListener('click', function () {
              trySnapAndLockPhase1(true);
            });
          }

          if (canvas) {
            canvas.style.touchAction = 'none';
            var dragging = false;
            var moveFromPointer = function (evt) {
              var g = CanvasRenderers.getGeometry(canvas, theme);
              if (!g) return;
              var rect = canvas.getBoundingClientRect();
              var px = evt.clientX - rect.left;
              var py = evt.clientY - rect.top;
              if (px < g.padLeft - 12 || px > g.padLeft + g.plotW + 16) return;

              if (thSt.phase1.step === 'explore') {
                var newFreeT = Math.max(0, Math.min(maxDomainT, Math.round(g.fromPxX(px) * 2) / 2));
                var newExY = Math.max(0, Math.min(maxProbeY, Math.round(g.fromPxY(py))));
                var dx = Math.abs(newFreeT - thSt.phase1.freeT) / maxDomainT;
                var dy = Math.abs(newExY - thSt.phase1.exploreY) / maxProbeY;
                thSt.phase1.freeT = newFreeT;
                thSt.phase1.exploreY = newExY;
                thSt.phase1.lastExploreMoved = dy > dx * 1.4 ? 'y' : 't';
                if (freeSlider) freeSlider.value = String(newFreeT);
                if (exploreYSlider) exploreYSlider.value = String(newExY);
                if (freeValBadge) freeValBadge.textContent = 'x = ' + Formatters.formatNumber(newFreeT, 1) + ' ' + theme.unitX;
                if (exploreYBadge) exploreYBadge.textContent = 'y = ' + Formatters.formatNumber(newExY, 0) + ' ' + theme.unitY;
                if (exploreHint) {
                  exploreHint.innerHTML = '<span class="feedback-icon">&#128161;</span><div>' + buildPhase1ExploreHintHTML(theme, thSt.phase1) + '</div>';
                }
                StateStore.save();
                redrawActiveCanvas();
              } else {
                thSt.phase1.x = Math.round(g.fromPxX(px) * 2) / 2;
                thSt.phase1.y = Math.round(g.fromPxY(py));
                if (sliderX) sliderX.value = String(thSt.phase1.x);
                if (sliderY) sliderY.value = String(thSt.phase1.y);

                syncPhase1DOMAfterPointLock(null);
                trySnapAndLockPhase1(false);
                StateStore.save();
                redrawActiveCanvas();
              }
            };

            canvas.addEventListener('pointerdown', function (e) {
              dragging = true;
              if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
              moveFromPointer(e);
            });
            canvas.addEventListener('pointermove', function (e) {
              if (dragging) moveFromPointer(e);
            });
            canvas.addEventListener('pointerup', function () { dragging = false; });
            canvas.addEventListener('pointercancel', function () { dragging = false; });
          }
        }

        /* --------------------------------------------------------------------
           OBERFLÄCHE 3 – PHASE 2: PUNKTE ZUR GERADEN VERBINDEN (RUHIG & OHNE AUTO-ANIMATION)
           -------------------------------------------------------------------- */
        function getPhase2ScannerStatusText(density, theme) {
          if (density >= 95) {
            return 'Kontinuierliche Erfassung im gesamten Definitionsbereich: Stetiger Funktionsgraph (Gerade) &#10003;';
          }
          var isPool = theme.id === 'pool';
          var baseStep = isPool ? 5 : 2;
          var maxT = isPool ? 25 : 12;
          var dt = baseStep * Math.pow(0.018, density / 100);
          var count = Math.floor(maxT / dt) + 1;
          return 'Abtastintervall (&Delta;x): alle ' + Formatters.formatNumber(dt, 2) + ' ' + theme.unitX + ' (' + count + ' Wertepaare)';
        }

        function getPhase2LiveExplanation(density, theme) {
          var isPool = theme.id === 'pool';
          if (density < 30) {
            return '<strong>&#128269; Diskrete Einzelmessungen:</strong> Rechts erfasst der Sensor nur grobe Zwischenstände &ndash; obwohl ' +
              (isPool ? 'die Tauchpumpe in Wahrheit pausenlos durchläuft.' : 'das Abo in Wahrheit jeden Tag weiterläuft.');
          } else if (density < 85) {
            return '<strong>&#9889; Verdichtung im Definitionsbereich:</strong> Die Messabstände werden feiner: Links füllen zusätzliche geordnete Wertepaare P(x | y) die Lücken zwischen den Messpunkten.';
          } else {
            return '<strong>&#128207; Stetiger Funktionsgraph (Gerade):</strong> Alle Zwischenwerte sind lückenlos vorhanden (<em>stetig</em>) &ndash; links verbinden sich die Wertepaare im I.&nbsp;Quadranten zur durchgehenden Geraden!';
          }
        }

        function animatePhase2CalmPreview() {
          if (p2AnimFrame) {
            cancelPhase2Animation();
            StateStore.save();
            return;
          }
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var maxT = theme.id === 'pool' ? 25 : 12;
          var durationMs = 10500; // Sehr ruhige, augenfreundliche 10,5 Sekunden
          var startTime = null;

          var p2Btn = document.getElementById('btn-p2-calm-preview');
          if (p2Btn) {
            p2Btn.innerHTML = '&#9208; Ruhige Vorschau anhalten';
          }

          function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min(1, (ts - startTime) / durationMs);
            var eased = 0.5 - 0.5 * Math.cos(Math.PI * progress);
            thSt.phase2.previewT = maxT * eased;
            redrawActiveCanvas();

            if (progress < 1) {
              p2AnimFrame = window.requestAnimationFrame(step);
            } else {
              thSt.phase2.previewT = maxT;
              redrawActiveCanvas();
              StateStore.save();
              p2AnimFrame = null;
              var btnDone = document.getElementById('btn-p2-calm-preview');
              if (btnDone) {
                btnDone.innerHTML = '&#9654; Abtastung ruhig abspielen';
              }
            }
          }

          p2AnimFrame = window.requestAnimationFrame(step);
        }

                    (p2.scannedContinuous ? '&#10003; Scanner auf stetigen Funktionsgraphen (Gerade) gestellt' : 'Schritt 1: Schiebe den Dichte-Regler oben bis auf 100 %.') +

        function updatePhase2FeedbackDOM() {
          var thSt = StateStore.getCurrentThemeState();
          var p2 = thSt.phase2;
          var box = document.getElementById('p2-feedback-box');
          if (!box) return;

          if (!p2.feedbackMsg) {
            box.hidden = true;
            return;
          }
          box.hidden = false;
          var cls = p2.feedbackOk ? (thSt.completed[2] ? 'feedback-success' : 'feedback-info') : 'feedback-hint';
          box.className = 'feedback-banner ' + cls;
          box.innerHTML =
            '<span class="feedback-icon">' + (p2.feedbackOk ? '&#10003;' : '&#128161;') + '</span>' +
            '<div>' + Formatters.escapeHTML(p2.feedbackMsg) + '</div>';
        }

        function checkPhase2Completion() {
          var thSt = StateStore.getCurrentThemeState();
          var p2 = thSt.phase2;

          if (p2.scannedContinuous && p2.textSolved && !thSt.completed[2]) {
            thSt.completed[2] = true;
            thSt.merkblattOpen[2] = true;
            StateStore.save();
            renderHeader();

            var slot = document.getElementById('p2-completion-slot');
            if (slot) slot.innerHTML = buildABAndMerkblattHTML(2, true);
            var topbar = document.querySelector('.workspace-topbar');
            if (topbar) topbar.outerHTML = buildWorkspaceTopbar(2);
            updatePhase2FeedbackDOM();
          }

        function bindPhase2Events() {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var slider = document.getElementById('slider-p2-density');
          var valBadge = document.getElementById('val-p2-density');
          var readout = document.getElementById('p2-scanner-readout');
          var liveExp = document.getElementById('p2-live-explanation');
          var scanReq = document.getElementById('p2-scan-requirement');
          var textarea = document.getElementById('textarea-p2');
          var evalBtn = document.getElementById('btn-p2-evaluate');

          if (slider) {
            slider.addEventListener('input', function () {
              var d = parseFloat(slider.value);
              thSt.phase2.density = d;
              if (d >= 95) thSt.phase2.scannedContinuous = true;

              if (valBadge) valBadge.textContent = Math.round(d) + ' %';
              if (readout) readout.innerHTML = getPhase2ScannerStatusText(d, theme);
              if (liveExp) {
                liveExp.innerHTML = '<span class="feedback-icon">&#128161;</span><div>' + getPhase2LiveExplanation(d, theme) + '</div>';
              }

                scanReq.innerHTML = '&#10003; Scanner auf stetigen Funktionsgraphen (Gerade) gestellt';
              }

              StateStore.save();
              checkPhase2Completion();
              redrawActiveCanvas();
            });

          if (textarea) {
            textarea.addEventListener('input', function () {
              thSt.phase2.explanationText = textarea.value;
              StateStore.save();
            });

            evalBtn.addEventListener('click', function () {
              var text = textarea ? textarea.value : thSt.phase2.explanationText;

              var res = Evaluators.evaluatePhase2Text(theme, text);
              thSt.phase2.feedbackOk = res.ok;

              if (res.ok) {
                thSt.phase2.textSolved = true;
                thSt.phase2.feedbackMsg = !thSt.phase2.scannedContinuous
                  ? res.message + ' Schiebe jetzt noch den Dichte-Regler ganz auf 100 %.'
                  : res.message;
              } else {
                thSt.phase2.feedbackMsg = res.message;
              }

              StateStore.save();
              updatePhase2FeedbackDOM();
              checkPhase2Completion();
            });
          }
        }

        /* --------------------------------------------------------------------
           OBERFLÄCHE 3 – PHASE 3: FUNKTIONSANALYSE (RUHIGE, SANFTE BEWEGUNG AUF KLICK)
           -------------------------------------------------------------------- */
        function getTickerTextForTime(theme, t) {
          for (var i = 0; i < theme.tickerSteps.length; i++) {
            if (t <= theme.tickerSteps[i].limit) {
              return theme.tickerSteps[i].text;
            }
          }
          return theme.tickerSteps[theme.tickerSteps.length - 1].text;
        }

        function animateProbeSlowly(targetT, durationMs, isFullSweep) {
          cancelProbeAnimation();
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var startT = thSt.phase3.probeT;
          var diff = targetT - startT;

          if (Math.abs(diff) < 0.01) {
            thSt.phase3.probeT = targetT;
            p3LiveTickerText = getTickerTextForTime(theme, targetT);
            syncPhase3ProbeUI();
            StateStore.save();
            return;
          }

          var dur = durationMs || 9500; // Sehr langsame, entspannte 9,5 Sekunden
          var startTime = null;

          if (isFullSweep) {
            var sweepBtns = document.querySelectorAll('[data-action="probe-sweep"]');
            for (var b = 0; b < sweepBtns.length; b++) {
              sweepBtns[b].innerHTML = '&#9208; Ruhigen Durchlauf anhalten';
            }
          }

          function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min(1, (ts - startTime) / dur);
            // Sanftes Sinus-Ease-In-Out für entspanntes, ruckfreies Gleiten
            var eased = 0.5 - 0.5 * Math.cos(Math.PI * progress);
            thSt.phase3.probeT = startT + diff * eased;

            p3LiveTickerText = getTickerTextForTime(theme, thSt.phase3.probeT);
            syncPhase3ProbeUI();

            if (progress < 1) {
              probeAnimFrame = window.requestAnimationFrame(step);
            } else {
              thSt.phase3.probeT = targetT;
              p3LiveTickerText = getTickerTextForTime(theme, targetT);
              probeAnimFrame = null;
              var btnsReset = document.querySelectorAll('[data-action="probe-sweep"]');
              for (var r = 0; r < btnsReset.length; r++) {
                btnsReset[r].innerHTML = '&#9654; Verlauf ruhig abfahren';
              }
              syncPhase3ProbeUI();
              StateStore.save();
            }
          }

          probeAnimFrame = window.requestAnimationFrame(step);
        }

        function syncPhase3ProbeUI() {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var t = thSt.phase3.probeT;
          var yVal = theme.id === 'pool' ? 100 - 4 * t : 15 * t;

          var slider = document.getElementById('slider-p3-probe');
          var badge = document.getElementById('val-p3-probe');
          var telX = document.getElementById('tel-p3-x');
          var telY = document.getElementById('tel-p3-y');
          var tickerEl = document.getElementById('p3-live-ticker');

          if (slider && document.activeElement !== slider) {
            slider.value = String(Math.round(t * 2) / 2);
          }
          if (badge) badge.textContent = 'x = t = ' + Formatters.formatNumber(t, 1) + ' ' + theme.unitX;
          if (telX) telX.textContent = Formatters.formatNumber(t, 1) + ' ' + theme.unitX;
          if (telY) telY.textContent = Formatters.formatNumber(yVal, 1) + ' ' + theme.unitY;
          if (tickerEl) tickerEl.innerHTML = '&#9201; ' + Formatters.escapeHTML(p3LiveTickerText || getTickerTextForTime(theme, t));

          redrawActiveCanvas();
        }

        function buildStepChoicesHTML(stepNum, options, selectedId, isStepDone, isLocked) {
          var html = '<div class="choice-stack">';
          for (var i = 0; i < options.length; i++) {
            var opt = options[i];
            var cls = 'choice-option-btn';
            var icon = '';
            if (isStepDone && opt.correct) {
              cls += ' is-correct';
              icon = '<span>&#10003;</span>';
            } else if (!isStepDone && selectedId === opt.id && !opt.correct) {
              cls += ' is-wrong';
              icon = '<span>&#10005;</span>';
            }

            html +=
              '<button type="button" class="' + cls + '" data-action="p3-choice" data-step="' + stepNum + '" data-choice="' + opt.id + '"' +
                ((isStepDone || isLocked) ? ' disabled' : '') + '>' +
                '<span>' + Formatters.escapeHTML(opt.label) + '</span>' +
                icon +
              '</button>';
          }
          html += '</div>';
          return html;
        }

            '<div class="inspector-step-card ' + (p3.step2Done ? 'is-done' : (step2Unlocked ? 'is-active' : 'is-locked')) + '">' +

              buildStepChoicesHTML(2, theme.step2Options, p3.step2Choice, p3.step2Done, !step2Unlocked) +
              renderFeedback(2) +
            '</div>' +

            /* Schritt 3: Nullstelle */
            '<div class="inspector-step-card ' + (p3.step3Done ? 'is-done' : (step3Unlocked ? 'is-active' : 'is-locked')) + '">' +
              '<div class="step-header-row">' +
                '<h3 class="step-title">Prüfschritt 3: Nullstelle / Achsenschnittpunkt N(<span class="math-var">x</span><sub>0</sub> | 0) bei Ordinate <span class="math-var">y</span> = 0</h3>' +
                '<button type="button" class="ios-btn ios-btn-tinted ios-btn-sm" data-action="probe-jump-zero"' + (step3Unlocked ? '' : ' disabled') + '>' +
                  'Sonde ruhig auf y = 0 bewegen' +
                '</button>' +
              '</div>' +
              '<p class="card-subtitle" style="font-size: 0.9rem;">Bewege die Sonde bei Bedarf auf die Abszissenachse (Rechtsachse), wo der Funktionswert (Ordinate <span class="math-var">y</span>) null ist. Was bedeutet dieser Punkt real?</p>' +
              buildStepChoicesHTML(3, theme.step3Options, p3.step3Choice, p3.step3Done, !step3Unlocked) +
              renderFeedback(3) +
            '</div>'
          );
        }

        function renderPhase3Workspace() {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var p3 = thSt.phase3;
          var maxT = theme.id === 'pool' ? 25 : 12;
          var curY = theme.id === 'pool' ? 100 - 4 * p3.probeT : 15 * p3.probeT;

          mainEl.innerHTML =
            buildWorkspaceTopbar(3) +
            '<section class="ios-card">' +
              '<span class="section-eyebrow">Phase 3 von 3 &middot; Prozess-Zustands-Inspektor (I. Quadrant)</span>' +
              '<h2 class="card-title">Mathematische Funktionsanalyse durchführen</h2>' +
              '<p class="card-subtitle">' +
                'Bewege die Sonde per Schieberegler oder starte optional einen ruhigen, augenfreundlichen Durchlauf: Links wandert P(Abszisse <span class="math-var">x</span> | Ordinate <span class="math-var">y</span>), rechts siehst du den realen Zustand.' +
              '</p>' +

              '<div class="dual-stage-grid">' +
                '<div class="stage-panel">' +
                  '<div class="stage-panel-head">' +
                    '<span>&#128208; Prozess-Zustands-Inspektor (I. Quadrant)</span>' +
                    '<span>Sonde P(x | y)</span>' +
                  '</div>' +
                  '<canvas id="phase3-canvas" class="graph-canvas" aria-label="Prozess-Zustands-Inspektor"></canvas>' +
                '</div>' +
                '<div class="stage-panel">' +
                  '<div class="stage-panel-head">' +
                    '<span>' + theme.icon + ' Synchronisierte Themen-Ansicht</span>' +
                    '<span class="stage-live-dot">Ruhige Ansicht</span>' +
                  '</div>' +
                  '<canvas id="phase3-scene-canvas" class="scene-canvas" aria-label="Synchronisierte Realszene Phase 3"></canvas>' +
                '</div>' +
              '</div>' +

              '<div class="controls-panel">' +
                '<div class="slider-group">' +
                  '<div class="slider-label-row">' +
                    '<label for="slider-p3-probe">x-Achse / Abszissenachse: Zeit-Sonde entlang des Funktionsgraphen bewegen</label>' +
                    '<span id="val-p3-probe" class="slider-value-badge">x = t = ' + Formatters.formatNumber(p3.probeT, 1) + ' ' + theme.unitX + '</span>' +
                  '</div>' +
                  '<input type="range" id="slider-p3-probe" class="ios-range" min="0" max="' + maxT + '" step="0.5" value="' + p3.probeT + '">' +
                  '<div class="probe-quick-btns">' +
                    '<button type="button" class="ios-btn ios-btn-secondary ios-btn-sm" data-action="probe-sweep">&#9654; Verlauf ruhig abfahren</button>' +
                    '<button type="button" class="ios-btn ios-btn-secondary ios-btn-sm" data-action="probe-jump-start">y-Achsenabschnitt S<sub>y</sub> (x = 0)</button>' +
                    '<button type="button" class="ios-btn ios-btn-secondary ios-btn-sm" data-action="probe-jump-zero">Nullstelle N (y = 0)</button>' +
                  '</div>' +
                '</div>' +

                '<div class="telemetry-bar">' +
                  '<div class="telemetry-tile">' +
                    '<span class="telemetry-label">Rechtswert / Abszisse x (Zeit t)</span>' +
                    '<span id="tel-p3-x" class="telemetry-val">' + Formatters.formatNumber(p3.probeT, 1) + ' ' + theme.unitX + '</span>' +
                  '</div>' +
                  '<div class="telemetry-tile">' +
                    '<span class="telemetry-label">Hochwert / Ordinate y (Funktionswert)</span>' +
                    '<span id="tel-p3-y" class="telemetry-val">' + Formatters.formatNumber(curY, 1) + ' ' + theme.unitY + '</span>' +
                  '</div>' +
                  '<div class="telemetry-tile">' +
                    '<span class="telemetry-label">Verlauf (Monotonieverhalten)</span>' +
                    '<span class="telemetry-val" style="font-size: 0.9rem; color: var(--ios-blue);">' + (theme.direction === 'falling' ? 'Streng monoton fallend' : 'Streng monoton steigend') + '</span>' +
                  '</div>' +
                '</div>' +

                '<div id="p3-live-ticker" class="live-ticker-box">' +
                  '&#9201; ' + Formatters.escapeHTML(getTickerTextForTime(theme, p3.probeT)) +
                '</div>' +
              '</div>' +

              '<div id="p3-steps-container" class="inspector-steps">' +
                buildPhase3StepsHTML() +
              '</div>' +

              '<div id="p3-completion-slot">' + buildABAndMerkblattHTML(3, true) + '</div>' +
            '</section>';

          bindPhase3Events();
          redrawActiveCanvas();
        }

        function handlePhase3Choice(stepNum, choiceId) {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var p3 = thSt.phase3;

          if (stepNum === 1 && !p3.step1Done) {
            p3.step1Choice = choiceId;
            var expectedChoice = theme.id === 'pool' ? 'falls' : 'rises';
            if (choiceId === expectedChoice) {
              p3.step1Done = true;
              p3FeedbackState[1] = {
                type: 'success',
                text: theme.step1Success
              };
            } else {
              p3FeedbackState[1] = {
                type: 'hint',
                text: 'Betrachte den Funktionsgraphen von links nach rechts (wachsende Abszisse x): Steigt die Ordinate y an oder fällt sie ab?'
              };
            }
          } else if (stepNum === 2 && p3.step1Done && !p3.step2Done) {
            p3.step2Choice = choiceId;
            var expectedStep2 = theme.id === 'pool' ? 'y100' : 'y0';
            if (choiceId === expectedStep2) {
              p3.step2Done = true;
              p3FeedbackState[2] = {
                type: 'success',
                text: theme.step2Success
              };
            } else {
              p3FeedbackState[2] = {
                type: 'hint',
                text: AppData.PHASES[2].errorHint
              };
            }
          } else if (stepNum === 3 && p3.step2Done && !p3.step3Done) {
            p3.step3Choice = choiceId;
            var expectedStep3 = theme.id === 'pool' ? 'n25' : 'n0';
            if (choiceId === expectedStep3) {
              p3.step3Done = true;
              p3FeedbackState[3] = {
                type: 'success',
                text: theme.step3Success
              };
              if (!thSt.completed[3]) {
                thSt.completed[3] = true;
                thSt.merkblattOpen[3] = true;
              }
            } else {
              p3FeedbackState[3] = {
                type: 'hint',
                text: AppData.PHASES[2].errorHint
              };
            }
          }

          StateStore.save();
          renderHeader();

          var stepsContainer = document.getElementById('p3-steps-container');
          if (stepsContainer) stepsContainer.innerHTML = buildPhase3StepsHTML();
          var slot = document.getElementById('p3-completion-slot');
          if (slot) slot.innerHTML = buildABAndMerkblattHTML(3, true);
          var topbar = document.querySelector('.workspace-topbar');
          if (topbar) topbar.outerHTML = buildWorkspaceTopbar(3);

          redrawActiveCanvas();
        }

        function bindPhase3Events() {
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();
          var slider = document.getElementById('slider-p3-probe');
          var canvas = document.getElementById('phase3-canvas');

          if (slider) {
            slider.addEventListener('input', function () {
              cancelProbeAnimation();
              thSt.phase3.probeT = parseFloat(slider.value);
              p3LiveTickerText = getTickerTextForTime(theme, thSt.phase3.probeT);
              syncPhase3ProbeUI();
              StateStore.save();
            });
          }

          if (canvas) {
            canvas.style.touchAction = 'pan-y';
            var dragging = false;
            var moveFromPointer = function (evt) {
              cancelProbeAnimation();
              var g = CanvasRenderers.getGeometry(canvas, theme);
              if (!g) return;
              var rect = canvas.getBoundingClientRect();
              var px = evt.clientX - rect.left;
              if (px < g.padLeft - 12 || px > g.padLeft + g.plotW + 16) return;

              var maxT = theme.id === 'pool' ? 25 : 12;
              var rawT = Math.max(0, Math.min(maxT, g.fromPxX(px)));
              thSt.phase3.probeT = Math.round(rawT * 2) / 2;
              p3LiveTickerText = getTickerTextForTime(theme, thSt.phase3.probeT);
              syncPhase3ProbeUI();
              StateStore.save();
            };

            canvas.addEventListener('pointerdown', function (e) {
              dragging = true;
              if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
              moveFromPointer(e);
            });
            canvas.addEventListener('pointermove', function (e) {
              if (dragging) moveFromPointer(e);
            });
            canvas.addEventListener('pointerup', function () { dragging = false; });
            canvas.addEventListener('pointercancel', function () { dragging = false; });
          }
        }

        /* --------------------------------------------------------------------
           HAUPT-RENDERER & BEDARFSGESTEUERTES CANVAS-ZEICHNEN (KEINE AUTO-SCHLEIFE)
           -------------------------------------------------------------------- */
        function render() {
          cancelPhase2Animation();
          cancelProbeAnimation();
          renderHeader();

          var st = StateStore.get();
          if (st.topMode === 'timeline') {
            renderTimelineView();
            return;
          }

          if (st.activePhase === 1) {
            renderPhase1Workspace();
          } else if (st.activePhase === 2 && StateStore.isUnlocked(2)) {
            renderPhase2Workspace();
          } else if (st.activePhase === 3 && StateStore.isUnlocked(3)) {
            renderPhase3Workspace();
          } else {
            st.activePhase = null;
            renderDiscoveryHub();
          }
        }

        function redrawActiveCanvas() {
          var st = StateStore.get();
          var thSt = StateStore.getCurrentThemeState();
          var theme = StateStore.getCurrentTheme();

          if (st.topMode === 'timeline') {
            var tCanvas = document.getElementById('teacher-canvas');
            if (tCanvas) {
              CanvasRenderers.renderTeacherCoordinateSystem(tCanvas, st.teacherFocus, st.onlyRelevantQuadrant);
            }
            return;
          }

          if (st.activePhase === 1) {
            var p1 = thSt.phase1;
            var maxDomainT = theme.id === 'pool' ? 25 : 12;
            var c1 = document.getElementById('phase1-canvas');
            var sc1 = document.getElementById('phase1-scene-canvas');

            if (p1.step === 'explore') {
              if (c1) {
                CanvasRenderers.renderPhase1ExploreGraph(c1, theme, p1);
              }
              if (sc1) {
                CanvasRenderers.renderRealScene(sc1, theme, {
                  mode: 'explore',
                  t: p1.freeT,
                  probeY: p1.exploreY
                });
              }
            } else {
              if (c1) {
                CanvasRenderers.renderPhase1Plot(c1, theme, p1);
              }
              if (sc1) {
                var lockedHighlight = null;
                if (p1.lastLockedIndex != null && theme.points[p1.lastLockedIndex]) {
                  var lp = theme.points[p1.lastLockedIndex];
                  if (Math.abs(p1.x - lp.t) < 0.05 && Math.abs(p1.y - lp.y) < 0.05) {
                    lockedHighlight = '\u2713 Wertepaar P(' + lp.t + ' | ' + lp.y + ') fixiert';
                  }
                }
                CanvasRenderers.renderRealScene(sc1, theme, {
                  mode: 'plot',
                  t: Math.max(0, Math.min(maxDomainT, p1.x)),
                  probeY: p1.y,
                  highlightLabel: lockedHighlight
                });
              }
            }
          } else if (st.activePhase === 2) {
            var d = thSt.phase2.density;
            var c2 = document.getElementById('phase2-canvas');
            var sc2 = document.getElementById('phase2-scene-canvas');
            if (c2) {
              CanvasRenderers.renderPhase2(c2, theme, d);
            }
            if (sc2) {
              var maxT2 = theme.id === 'pool' ? 25 : 12;
              var baseStep2 = theme.id === 'pool' ? 5 : 2;
              var dt2 = baseStep2 * Math.pow(0.018, d / 100);
              var rawPreviewT = thSt.phase2.previewT != null ? thSt.phase2.previewT : (theme.id === 'pool' ? 12.5 : 6.5);
              var quantizedT = d >= 95 ? rawPreviewT : Math.min(maxT2, Math.floor(rawPreviewT / dt2) * dt2);
              CanvasRenderers.renderRealScene(sc2, theme, {
                mode: 'scanner',
                t: quantizedT,
                density: d
              });
            }
          } else if (st.activePhase === 3) {
            var c3 = document.getElementById('phase3-canvas');
            var sc3 = document.getElementById('phase3-scene-canvas');
            if (c3) {
              CanvasRenderers.renderPhase3(c3, theme, thSt.phase3);
            }
            if (sc3) {
              CanvasRenderers.renderRealScene(sc3, theme, {
                mode: 'inspector',
                t: thSt.phase3.probeT
              });
            }
          }
        }

        function initGlobalListeners() {
          segTimelineBtn.addEventListener('click', function () {
            var st = StateStore.get();
            st.topMode = 'timeline';
            StateStore.save();
            render();
          });

          segDiscoveryBtn.addEventListener('click', function () {
            var st = StateStore.get();
            st.topMode = 'discovery';
            StateStore.save();
            render();
          });

          // Praxisthema Umschalter (ruhig, ohne automatische Quadranten-Animation)
          themeBtnPool.addEventListener('click', function () {
            var st = StateStore.get();
            st.currentTheme = 'pool';
            p1FeedbackState = null;
            p3FeedbackState = { 1: null, 2: null, 3: null };
            p3LiveTickerText = '';
            StateStore.save();
            render();
          });

          themeBtnStreaming.addEventListener('click', function () {
            var st = StateStore.get();
            st.currentTheme = 'streaming';
            p1FeedbackState = null;
            p3FeedbackState = { 1: null, 2: null, 3: null };
            p3LiveTickerText = '';
            StateStore.save();
            render();
          });

          // Globale Delegation
          mainEl.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-action]');
            if (!btn || btn.disabled) return;

            var action = btn.getAttribute('data-action');
            var st = StateStore.get();
            var thSt = StateStore.getCurrentThemeState();
            var theme = StateStore.getCurrentTheme();

            if (action === 'switch-to-discovery') {
              st.topMode = 'discovery';
              st.activePhase = null;
              StateStore.save();
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (action === 'toggle-relevant-quadrant') {
              st.onlyRelevantQuadrant = !st.onlyRelevantQuadrant;
              StateStore.save();
              render();
            } else if (action === 'teacher-focus') {
              st.teacherFocus = btn.getAttribute('data-focus');
              StateStore.save();
              render();
            } else if (action === 'open-phase') {
              var pId = parseInt(btn.getAttribute('data-phase'), 10);
              if (StateStore.isUnlocked(pId)) {
                st.topMode = 'discovery';
                st.activePhase = pId;
                StateStore.save();
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            } else if (action === 'back-to-hub') {
              st.activePhase = null;
              StateStore.save();
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (action === 'p1-unlock-table') {
              thSt.phase1.step = 'plot';
              StateStore.save();
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (action === 'p1-back-explore') {
              thSt.phase1.step = 'explore';
              StateStore.save();
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (action === 'inspect-point') {
              var ptIdx = parseInt(btn.getAttribute('data-point-index'), 10);
              var targetPt = theme.points[ptIdx];
              if (targetPt) {
                thSt.phase1.x = targetPt.t;
                thSt.phase1.y = targetPt.y;
                thSt.phase1.lastLockedIndex = targetPt.index;
                p1FeedbackState = {
                  type: 'success',
                  text: 'Geordnetes Wertepaar P(' + targetPt.t + ' | ' + targetPt.y + ') aktiv: ' + targetPt.realNote
                };
                StateStore.save();
                syncPhase1DOMAfterPointLock(targetPt);
              }
            } else if (action === 'toggle-merkblatt') {
              var mId = parseInt(btn.getAttribute('data-phase'), 10);
              if (thSt.completed[mId]) {
                thSt.merkblattOpen[mId] = !thSt.merkblattOpen[mId];
                StateStore.save();
                render();
              }
            } else if (action === 'p2-calm-preview') {
              animatePhase2CalmPreview();
            } else if (action === 'probe-sweep') {
              if (probeAnimFrame) {
                cancelProbeAnimation();
                StateStore.save();
              } else {
                var maxT = theme.id === 'pool' ? 25 : 12;
                thSt.phase3.probeT = 0;
                syncPhase3ProbeUI();
                animateProbeSlowly(maxT, 9500, true); // Entspannte, ruhige 9,5 Sekunden
              }
            } else if (action === 'probe-jump-start') {
              animateProbeSlowly(0, 2800, false);
            } else if (action === 'probe-jump-zero') {
              var zeroT = theme.id === 'pool' ? 25 : 0;
              animateProbeSlowly(zeroT, 2800, false);
            } else if (action === 'p3-choice') {
              var stepNum = parseInt(btn.getAttribute('data-step'), 10);
              var choiceId = btn.getAttribute('data-choice');
              handlePhase3Choice(stepNum, choiceId);
            }
          });

          // Reset Modal
          document.getElementById('btn-open-reset').addEventListener('click', function () {
            resetModal.hidden = false;
          });
          document.getElementById('btn-cancel-reset').addEventListener('click', function () {
            resetModal.hidden = true;
          });
          resetModal.addEventListener('click', function (e) {
            if (e.target === resetModal) resetModal.hidden = true;
          });
          document.getElementById('btn-confirm-reset').addEventListener('click', function () {
            cancelPhase2Animation();
            cancelProbeAnimation();
            p1FeedbackState = null;
            p3FeedbackState = { 1: null, 2: null, 3: null };
            p3LiveTickerText = '';
            StateStore.resetCurrentTheme();
            resetModal.hidden = true;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });

          var resizeRaf = null;
          function scheduleResponsiveRedraw() {
            if (resizeRaf) window.cancelAnimationFrame(resizeRaf);
            resizeRaf = window.requestAnimationFrame(function () {
              resizeRaf = null;
              redrawActiveCanvas();
            });
          }

          window.addEventListener('resize', scheduleResponsiveRedraw);
          window.addEventListener('orientationchange', function () {
            window.setTimeout(scheduleResponsiveRedraw, 80);
          });
        }

        return {
          init: function () {
            initGlobalListeners();
            render();
          }
        };
      })();

      UIController.init();
    })();
  </script>
</body>
</html>
