<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lernspiel: Gefahren von Verpackungsmüll</title>
  <style>
    :root {
      --bg-primary: #F2F2F7;
      --card-bg: #FFFFFF;
      --accent-blue: #007AFF;
      --accent-blue-hover: #0062CC;
      --accent-green: #34C759;
      --accent-red: #FF3B30;
      --text-main: #1C1C1E;
      --text-secondary: #8E8E93;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;

      /* Windows 11 Acrylic Material */
      --acrylic-bg: rgba(255, 255, 255, 0.82);
      --acrylic-blur: blur(28px) saturate(190%);
      --acrylic-border: 1px solid rgba(255, 255, 255, 0.75);
      --acrylic-shadow: 0 18px 40px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.06);
      --divider-color: rgba(0, 0, 0, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.45;
      padding: clamp(12px, 3vw, 32px) clamp(12px, 3vw, 24px) clamp(24px, 5vw, 48px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1060px;
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 2.5vw, 28px);
    }

    /* App Header */
    header {
      text-align: center;
      padding: 4px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 122, 255, 0.1);
      color: var(--accent-blue);
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: clamp(13px, 2vw, 15px);
      color: var(--text-secondary);
      max-width: 680px;
      margin: 0 auto;
      padding: 0 8px;
    }

    /* Post-It Zentrierkarte */
    .central-node-wrapper {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .central-postit {
      background: #FFFDF0;
      border: 1px solid #E6DEC5;
      border-radius: var(--radius-md);
      box-shadow: 0 6px 20px rgba(60, 50, 30, 0.08);
      padding: clamp(16px, 2.5vw, 22px) clamp(18px, 3vw, 28px);
      text-align: center;
      position: relative;
      max-width: min(380px, 92vw);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(70px, 15vw, 90px);
      height: 20px;
      background: #76A99A;
      border-radius: 3px;
      opacity: 0.92;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .central-postit h2 {
      font-size: clamp(14px, 2.2vw, 16px);
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #3C3830;
      text-transform: uppercase;
      line-height: 1.35;
    }

    /* Spalten */
    .branches-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 2vw, 24px);
    }

    .branch-column {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.5vw, 16px);
    }

    .column-header {
      background: linear-gradient(135deg, #5C8C7A 0%, #467362 100%);
      color: #FFFFFF;
      padding: clamp(12px, 2vw, 15px) clamp(14px, 2vw, 18px);
      border-radius: var(--radius-md);
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: var(--card-shadow);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .column-header.menschen {
      background: linear-gradient(135deg, #577D9E 0%, #3D6485 100%);
    }

    /* Zuordnungskarten */
    .assignment-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--card-shadow);
      padding: clamp(14px, 2vw, 18px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.5vw, 14px);
      position: relative;
      transition: all 0.25s ease;
    }

    .assignment-card.active-dropdown {
      z-index: 50;
    }

    .assignment-card.solved {
      border-color: var(--accent-green);
      background: #F8FCF9;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-tag {
      font-size: clamp(11px, 1.8vw, 12px);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .card-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D1D1D6;
      transition: background 0.2s ease;
    }

    .assignment-card.filled .card-status-dot {
      background: var(--accent-blue);
    }

    .assignment-card.solved .card-status-dot {
      background: var(--accent-green);
    }

    .interactive-inputs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    /* Dropdowns mit Windows 11 Acrylic Material */
    .custom-select {
      position: relative;
      width: 100%;
    }

    .select-trigger {
      width: 100%;
      min-height: 48px;
      background-color: #F8F8FA;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--radius-md);
      padding: 10px 38px 10px 14px;
      font-family: inherit;
      font-size: clamp(13px, 1.8vw, 14px);
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .select-trigger:focus,
    .custom-select.open .select-trigger {
      border-color: var(--accent-blue);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    .select-trigger-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
    }

    .select-trigger-text.placeholder {
      color: var(--text-secondary);
    }

    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-secondary);
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .custom-select.open .select-arrow {
      transform: translateY(-50%) rotate(180deg);
      color: var(--accent-blue);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--acrylic-bg);
      backdrop-filter: var(--acrylic-blur);
      -webkit-backdrop-filter: var(--acrylic-blur);
      border: var(--acrylic-border);
      border-radius: var(--radius-md);
      box-shadow: var(--acrylic-shadow);
      z-index: 100;
      overflow: hidden;
      display: none;
      max-height: 290px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
      animation: flyoutIn 0.18s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .custom-select.open .dropdown-menu {
      display: block;
    }

    @keyframes flyoutIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .custom-option {
      padding: 12px 14px;
      font-size: clamp(12.5px, 1.8vw, 13.5px);
      color: var(--text-main);
      cursor: pointer;
      border-bottom: 1px solid var(--divider-color);
      transition: background-color 0.15s ease, color 0.15s ease;
      line-height: 1.35;
    }

    .custom-option:last-child {
      border-bottom: none;
    }

    .custom-option:hover {
      background-color: rgba(0, 122, 255, 0.08);
      color: var(--accent-blue);
    }

    .custom-option.selected {
      background-color: rgba(0, 122, 255, 0.12);
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* Fixierte Lösungsansicht */
    .solved-view {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .assignment-card.solved .solved-view {
      display: flex;
    }

    .assignment-card.solved .interactive-inputs {
      display: none;
    }

    .solved-heading {
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 700;
      color: #1E543F;
      background: #EAF4EE;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
    }

    .solved-body {
      font-size: clamp(12.5px, 1.8vw, 14px);
      color: var(--text-main);
      line-height: 1.5;
      background: #F4F7F5;
      padding: clamp(10px, 2vw, 14px);
      border-radius: var(--radius-sm);
      white-space: pre-line;
      border-left: 3px solid #6E9B89;
    }

    /* Buttons & Feedback */
    .actions-bar {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .primary-btn {
      appearance: none;
      border: none;
      outline: none;
      width: 100%;
      max-width: 380px;
      min-height: 48px;
      height: clamp(48px, 6vw, 54px);
      border-radius: 14px;
      font-family: inherit;
      font-size: clamp(15px, 2vw, 16px);
      font-weight: 700;
      letter-spacing: -0.2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .primary-btn.disabled {
      background-color: #E5E5EA;
      color: var(--text-secondary);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .primary-btn.active {
      background-color: var(--accent-blue);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.28);
    }

    .primary-btn.active:hover {
      background-color: var(--accent-blue-hover);
      box-shadow: 0 6px 18px rgba(0, 122, 255, 0.35);
    }

    .primary-btn.active:active {
      transform: scale(0.98);
    }

    .reset-btn {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      display: none;
      min-height: 44px;
    }

    .reset-btn:hover {
      text-decoration: underline;
    }

    .feedback-banner {
      width: 100%;
      max-width: 580px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: clamp(12.5px, 2vw, 14px);
      font-weight: 600;
      text-align: center;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: fadeIn 0.25s ease;
    }

    .feedback-banner.error {
      display: flex;
      background: #FFEBEA;
      color: var(--accent-red);
      border: 1px solid rgba(255, 59, 48, 0.2);
    }

    .feedback-banner.success {
      display: flex;
      background: #E8F8EE;
      color: #248A3D;
      border: 1px solid rgba(52, 199, 89, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .shake {
      animation: iosShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes iosShake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 767px) {
      .branches-grid {
        grid-template-columns: 1fr;
      }
      .primary-btn {
        max-width: 100%;
      }
    }
  </style>
</head>

  <script>
    const HEADINGS = [
      { id: "globale_verteilung", text: "globale Verteilung" },
      { id: "tierwelt", text: "Tierwelt" },
      { id: "nahrungskette", text: "Nahrungskette" },
      { id: "eindringen_zellen", text: "Eindringen in die Zellen" }
    ];

    const DESCRIPTIONS = [
      {
        id: "desc_globale_verteilung",
        text: "Kunststoffverpackungen zerfallen durch z.B. UV-Strahlung oder Winde zu Mikroplastik und verbreitet sich durch Luftströme oder Meeresströmen unkontrolliert aus."
      },
      {
        id: "desc_tierwelt",
        text: "• Aufnahme von Makroplastik führt zu Sättigungsgefühl ohne Nährwert\\n• Aufnahme von Mikroplastik und deren Schadstoffe (wie Weichmacher) führen zu Vergiftungen"
      },
      {
        id: "desc_nahrungskette",
        text: "Permanente Schadstoffaufnahme durch Mikroplastik aus der Umwelt wie Wasser oder Fisch"
      },
      {
        id: "desc_eindringen_zellen",
        text: "Weichmacher wirken neurotoxisch und führen zu Zellstress. Dadurch können Tumore begünstigt werden"
      }
    ];

    const VALID_PAIRS = {
      "globale_verteilung": "desc_globale_verteilung",
      "tierwelt": "desc_tierwelt",
      "nahrungskette": "desc_nahrungskette",
      "eindringen_zellen": "desc_eindringen_zellen"
    };

    function populateDropdowns() {
      // Heading Dropdowns initialisieren
      document.querySelectorAll(".custom-select[data-type='heading']").forEach(selectEl => {
        const menu = selectEl.querySelector(".dropdown-menu");
        menu.innerHTML = "";
        HEADINGS.forEach(item => {
          const opt = document.createElement("div");
          opt.className = "custom-option";
          opt.dataset.value = item.id;
          opt.textContent = item.text;
          opt.addEventListener("click", (e) => {
            e.stopPropagation();
            selectOption(selectEl, item.id, item.text);
          });
          menu.appendChild(opt);
        });
      });

      // Description Dropdowns initialisieren
      document.querySelectorAll(".custom-select[data-type='desc']").forEach(selectEl => {
        const menu = selectEl.querySelector(".dropdown-menu");
        menu.innerHTML = "";
        DESCRIPTIONS.forEach(item => {
          const opt = document.createElement("div");
          opt.className = "custom-option";
          opt.dataset.value = item.id;
          const cleanText = item.text.replace(/\\\\n/g, " — ");
          opt.textContent = cleanText;
          opt.addEventListener("click", (e) => {
            e.stopPropagation();
            selectOption(selectEl, item.id, cleanText);
          });
          menu.appendChild(opt);
        });
      });

      // Dropdown Öffnen / Schließen Event
      document.querySelectorAll(".select-trigger").forEach(trigger => {
        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          const parentSelect = trigger.closest(".custom-select");
          const card = trigger.closest(".assignment-card");
          const wasOpen = parentSelect.classList.contains("open");

          closeAllDropdowns();

          if (!wasOpen) {
            parentSelect.classList.add("open");
            card.classList.add("active-dropdown");
          }
        });
      });
    }

    function selectOption(selectEl, value, label) {
      selectEl.dataset.value = value;
      const textEl = selectEl.querySelector(".select-trigger-text");
      textEl.textContent = label;
      textEl.classList.remove("placeholder");

      selectEl.querySelectorAll(".custom-option").forEach(opt => {
        opt.classList.toggle("selected", opt.dataset.value === value);
      });

      closeAllDropdowns();
      handleInputChange(selectEl.dataset.slot);
    }

    function closeAllDropdowns() {
      document.querySelectorAll(".custom-select").forEach(s => s.classList.remove("open"));
      document.querySelectorAll(".assignment-card").forEach(c => c.classList.remove("active-dropdown"));
    }

    document.addEventListener("click", () => {
      closeAllDropdowns();
    });

    function handleInputChange(slotId) {
      const card = document.getElementById(`card_${slotId}`);
      const hSelect = card.querySelector(".custom-select[data-type='heading']");
      const dSelect = card.querySelector(".custom-select[data-type='desc']");
      const hVal = hSelect.dataset.value;
      const dVal = dSelect.dataset.value;

      if (hVal && dVal) {
        card.classList.add("filled");
      } else {
        card.classList.remove("filled");
      }

      const allCards = document.querySelectorAll(".assignment-card");
      let allFilled = true;
      allCards.forEach(c => {
        const h = c.querySelector(".custom-select[data-type='heading']").dataset.value;
        const d = c.querySelector(".custom-select[data-type='desc']").dataset.value;
        if (!h || !d) allFilled = false;
      });

      const checkBtn = document.getElementById("checkButton");
      if (allFilled) {
        checkBtn.classList.remove("disabled");
        checkBtn.classList.add("active");
        checkBtn.removeAttribute("disabled");
      } else {
        checkBtn.classList.add("disabled");
        checkBtn.classList.remove("active");
        checkBtn.setAttribute("disabled", "true");
      }
    }

    function validateSolution() {
      closeAllDropdowns();

      const u1_h = document.querySelector("#card_u1 .custom-select[data-type='heading']").dataset.value;
      const u1_d = document.querySelector("#card_u1 .custom-select[data-type='desc']").dataset.value;
      const u2_h = document.querySelector("#card_u2 .custom-select[data-type='heading']").dataset.value;
      const u2_d = document.querySelector("#card_u2 .custom-select[data-type='desc']").dataset.value;

      const m1_h = document.querySelector("#card_m1 .custom-select[data-type='heading']").dataset.value;
      const m1_d = document.querySelector("#card_m1 .custom-select[data-type='desc']").dataset.value;
      const m2_h = document.querySelector("#card_m2 .custom-select[data-type='heading']").dataset.value;
      const m2_d = document.querySelector("#card_m2 .custom-select[data-type='desc']").dataset.value;

      const umweltPairs = [ {h: u1_h, d: u1_d}, {h: u2_h, d: u2_d} ];
      const umweltHeadings = [u1_h, u2_h];
      const umweltValid = 
        umweltHeadings.includes("globale_verteilung") &&
        umweltHeadings.includes("tierwelt") &&
        umweltPairs.every(p => VALID_PAIRS[p.h] === p.d);

      const menschenPairs = [ {h: m1_h, d: m1_d}, {h: m2_h, d: m2_d} ];
      const menschenHeadings = [m1_h, m2_h];
      const menschenValid = 
        menschenHeadings.includes("nahrungskette") &&
        menschenHeadings.includes("eindringen_zellen") &&
        menschenPairs.every(p => VALID_PAIRS[p.h] === p.d);

      const feedback = document.getElementById("feedbackBanner");
      const appContainer = document.getElementById("appContainer");

      if (umweltValid && menschenValid) {
        feedback.className = "feedback-banner success";
        feedback.innerHTML = `
          Hervorragend gelöst! Das Schema ist nun fixiert und bereit für dein Arbeitsblatt.
        `;

        document.querySelectorAll(".assignment-card").forEach(card => {
          card.classList.add("solved");
          const slot = card.dataset.slot;
          const hVal = card.querySelector(".custom-select[data-type='heading']").dataset.value;
          const dVal = card.querySelector(".custom-select[data-type='desc']").dataset.value;

          const hObj = HEADINGS.find(x => x.id === hVal);
          const dObj = DESCRIPTIONS.find(x => x.id === dVal);

          document.getElementById(`view_${slot}_title`).textContent = hObj.text;
          document.getElementById(`view_${slot}_desc`).textContent = dObj.text.replace(/\\\\n/g, "\\n");
        });

        document.getElementById("checkButton").style.display = "none";
        document.getElementById("resetButton").style.display = "inline-block";

        triggerConfetti();
      } else {
        feedback.className = "feedback-banner error";
        feedback.innerHTML = `
          Mindestens eine Zuordnung ist fehlerhaft. Die Felder werden zurückgesetzt...
        `;

        appContainer.classList.add("shake");
        setTimeout(() => {
          appContainer.classList.remove("shake");
        }, 500);

        setTimeout(() => {
          resetInputsOnly();
        }, 1300);
      }
    }

    function resetInputsOnly() {
      document.querySelectorAll(".custom-select").forEach(sel => {
        sel.dataset.value = "";
        const textEl = sel.querySelector(".select-trigger-text");
        textEl.textContent = sel.dataset.type === "heading" ? "— Überschrift auswählen —" : "— Erklärung auswählen —";
        textEl.classList.add("placeholder");
        sel.querySelectorAll(".custom-option").forEach(opt => opt.classList.remove("selected"));
      });

      document.querySelectorAll(".assignment-card").forEach(card => {
        card.classList.remove("filled");
      });

      const checkBtn = document.getElementById("checkButton");
      checkBtn.classList.add("disabled");
      checkBtn.classList.remove("active");
      checkBtn.setAttribute("disabled", "true");
      const feedback = document.getElementById("feedbackBanner");
      feedback.style.display = "none";
      feedback.className = "feedback-banner";
    }

    function resetGame() {
      document.querySelectorAll(".assignment-card").forEach(card => {
        card.classList.remove("solved", "filled");
      });
      document.getElementById("checkButton").style.display = "inline-flex";
      document.getElementById("resetButton").style.display = "none";
      resetInputsOnly();
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#007AFF', '#34C759', '#FF9500', '#AF52DE', '#FF2D55', '#5856D6', '#FFCC00'];

      for (let i = 0; i < 85; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          w: Math.random() * 8 + 6,
          h: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 8,
          alpha: 1
        });
      }

      let animationFrame;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rot += p.rotSpeed;
          p.alpha -= 0.009;

          if (p.alpha > 0) {
            active = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }
        });

        if (active) {
          animationFrame = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animationFrame);
        }
      }
      render();
    }

    window.addEventListener("resize", () => {
      const canvas = document.getElementById('confettiCanvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    document.addEventListener("DOMContentLoaded", populateDropdowns);
  </script>
</body>
