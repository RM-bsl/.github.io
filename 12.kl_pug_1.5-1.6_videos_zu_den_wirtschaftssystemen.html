<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuG 12 – Wirtschafts- und Staatsmodelle</title>
  <style>
    :root {
      --ios-bg-grouped: #F2F2F7;
      --ios-card-bg: #FFFFFF;
      --ios-glass-bg: rgba(255, 255, 255, 0.84);
      --ios-text-primary: #1C1C1E;
      --ios-text-secondary: #5C5C62;
      --ios-text-tertiary: #8E8E93;
      --ios-blue: #007AFF;
      --ios-blue-tint: rgba(0, 122, 255, 0.10);
      --ios-green: #248A3D;
      --ios-green-tint: rgba(52, 199, 89, 0.14);
      --ios-separator: rgba(60, 60, 67, 0.12);
      --ios-radius-xl: 22px;
      --ios-radius-lg: 16px;
      --ios-radius-md: 12px;
      --ios-radius-pill: 9999px;
      --ios-shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.04);
      --ios-shadow-card-hover: 0 14px 36px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.05);
      --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--ios-bg-grouped);
      color: var(--ios-text-primary);
      font-family: var(--ios-font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.45;
    }

    /* Frosted Glass Header */
    .ios-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--ios-glass-bg);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--ios-separator);
    }

    .header-inner {
      max-width: 1340px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kicker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subject-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-blue-tint);
      color: var(--ios-blue);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .header-subtitle {
      font-size: 0.88rem;
      color: var(--ios-text-secondary);
      margin: 0;
    }

    h1.app-title {
      margin: 0;
      font-size: clamp(1.38rem, 2.2vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--ios-text-primary);
      line-height: 1.18;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-card-bg);
      border: 1px solid var(--ios-separator);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ios-text-secondary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ios-blue);
      transition: background-color 0.25s ease;
    }

    .progress-pill.all-done {
      background: var(--ios-green-tint);
      border-color: rgba(36, 138, 61, 0.25);
      color: var(--ios-green);
    }

    .progress-pill.all-done .progress-dot {
      background: var(--ios-green);
    }

    .reset-btn {
      appearance: none;
      border: 1px solid var(--ios-separator);
      background: var(--ios-card-bg);
      color: var(--ios-text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--ios-radius-pill);
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .reset-btn:hover {
      color: var(--ios-text-primary);
      border-color: rgba(60, 60, 67, 0.28);
    }

    .reset-btn:active {
      transform: scale(0.96);
    }

    .reset-btn[hidden] {
      display: none;
    }

    /* Main Container */
    .dashboard-main {
      max-width: 1340px;
      margin: 0 auto;
      padding: 26px 28px 44px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    /* Large Rectangular Tile */
    .topic-tile {
      --accent: #007AFF;
      --accent-soft: rgba(0, 122, 255, 0.10);
      position: relative;
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr);
      min-height: 252px;
      background: var(--ios-card-bg);
      border-radius: var(--ios-radius-xl);
      border: 1px solid rgba(60, 60, 67, 0.10);
      box-shadow: var(--ios-shadow-card);
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.22s ease;
      will-change: transform;
    }

    .topic-tile:hover {
      transform: translateY(-4px);
      box-shadow: var(--ios-shadow-card-hover);
      border-color: var(--accent);
    }

    .topic-tile:active {
      transform: translateY(-1px) scale(0.992);
    }

    .topic-tile:focus-within {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* Portrait Column */
    .tile-media {
      position: relative;
      background: #E5E5EA;
      overflow: hidden;
      min-height: 100%;
    }

    .tile-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--img-pos, 50% 20%);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .topic-tile:hover .tile-media img {
      transform: scale(1.04);
    }

    .tile-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 68%, rgba(0, 0, 0, 0.56) 100%);
      pointer-events: none;
    }

    .portrait-caption {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 11px;
      z-index: 1;
      color: #FFFFFF;
      pointer-events: none;
    }

    .portrait-name {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    }

    .portrait-years {
      display: block;
      font-size: 0.74rem;
      font-weight: 500;
      opacity: 0.88;
      margin-top: 1px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
    }

    /* Content Column */
    .tile-body {
      padding: 20px 22px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .tile-top {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tile-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tile-number {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--ios-radius-pill);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .visited-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-green-tint);
      color: var(--ios-green);
      font-size: 0.74rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .topic-tile.is-visited .visited-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .tile-title {
      margin: 0;
      font-size: clamp(1.24rem, 1.6vw, 1.48rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--ios-text-primary);
    }

    /* Stretched link makes the entire large rectangular tile clickable */
    .tile-primary-link {
      color: inherit;
      text-decoration: none;
    }

    .tile-primary-link:focus {
      outline: none;
    }

    .tile-primary-link::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .tile-summary {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--ios-text-secondary);
    }

    /* Footer row inside tile */
    .tile-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--ios-separator);
    }

    .tile-cta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .canva-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--ios-radius-pill);
      background: var(--accent);
      color: #FFFFFF;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .topic-tile:hover .canva-pill {
      transform: translateX(2px);
    }

    .canva-arrow {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .source-row {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    /* Source link sits above the stretched link so students/teachers can verify image attribution directly */
    .source-link {
      position: relative;
      z-index: 2;
      display: inline-block;
      max-width: 100%;
      font-size: 0.74rem;
      color: var(--ios-text-tertiary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 0;
      transition: color 0.15s ease;
    }

    .source-link:hover,
    .source-link:focus-visible {
      color: var(--ios-blue);
      text-decoration: underline;
      outline: none;
    }

    /* Subtle Page Footer */
    .page-footer {
      max-width: 1340px;
      margin: 0 auto;
      padding: 0 28px 34px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--ios-text-tertiary);
    }

    /* Accent themes per principle */
    .theme-marktwirtschaft {
      --accent: #007AFF;
      --accent-soft: rgba(0, 122, 255, 0.11);
    }
    .theme-sozialstaat {
      --accent: #0E8A78;
      --accent-soft: rgba(14, 138, 120, 0.11);
    }
    .theme-planwirtschaft {
      --accent: #D93829;
      --accent-soft: rgba(217, 56, 41, 0.11);
    }
    .theme-sozialismus {
      --accent: #C85A17;
      --accent-soft: rgba(200, 90, 23, 0.11);
    }
    .theme-nachtwaechter {
      --accent: #5856D6;
      --accent-soft: rgba(88, 86, 214, 0.11);
    }
    .theme-kapitalismus {
      --accent: #248A3D;
      --accent-soft: rgba(36, 138, 61, 0.11);
    }

    /* Tablet & Mobile Responsive */
    @media (max-width: 1060px) {
      .topic-tile {
        grid-template-columns: 164px minmax(0, 1fr);
        min-height: 236px;
      }
      .tile-body {
        padding: 16px 18px 14px;
      }
    }

    @media (max-width: 992px) {
      .ios-header {
        position: relative;
        top: auto;
      }
      .header-inner {
        padding: 16px 20px;
      }
      .dashboard-main {
        padding: 20px 20px 36px;
      }
      .page-footer {
        padding: 0 20px 28px;
      }
    }

    @media (max-width: 860px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .topic-tile {
        grid-template-columns: 175px minmax(0, 1fr);
        min-height: 224px;
      }
    }

    @media (max-width: 560px) {
      .topic-tile {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .tile-media {
        height: 240px;
      }
      .tile-body {
        padding: 18px 18px 16px;
      }
      .header-meta {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .topic-tile,
      .tile-media img,
      .canva-pill,
      .visited-badge,
      .reset-btn {
        transition: none;
      }
      .topic-tile:hover,
      .topic-tile:hover .tile-media img,
      .topic-tile:hover .canva-pill {
        transform: none;
      }
    }
  </style>
</head>

          imgPos: '50% 20%',
          sourceLabel: 'Bildquelle: Wikipedia – David Ricardo (Thomas Phillips)',
          sourceUrl: 'https://de.wikipedia.org/wiki/Datei:Portrait_of_David_Ricardo_by_Thomas_Phillips.jpg'
        }
      ];

      function loadVisited() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? new Set(parsed) : new Set();
        } catch (_) {
          return new Set();
        }
      }

      function saveVisited(visitedSet) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(visitedSet)));
        } catch (_) {
          // Ignoriert Speicherfehler in strikten iFrame-Umgebungen
        }
      }

      const visited = loadVisited();
      const gridEl = document.getElementById('dashboardGrid');
      const progressPill = document.getElementById('progressPill');
      const progressText = document.getElementById('progressText');
      const resetBtn = document.getElementById('resetBtn');

      function updateProgressUI() {
        const count = visited.size;
        const total = TOPICS.length;
        progressText.textContent = count + ' / ' + total + ' geöffnet';
        progressPill.classList.toggle('all-done', count === total);
        resetBtn.hidden = count === 0;

        document.querySelectorAll('.topic-tile').forEach(function (tile) {
          tile.classList.toggle('is-visited', visited.has(tile.dataset.topicId));
        });
      }

      function createTile(topic) {
        const article = document.createElement('article');
        article.className = 'topic-tile ' + topic.theme;
        article.dataset.topicId = topic.id;
        if (visited.has(topic.id)) {
          article.classList.add('is-visited');
        }

        const media = document.createElement('div');
        media.className = 'tile-media';

        const img = document.createElement('img');
        img.src = topic.image;
        img.alt = 'Porträt von ' + topic.person + ' (' + topic.title + ')';
        img.loading = 'eager';
        img.decoding = 'async';
        img.style.setProperty('--img-pos', topic.imgPos);

        const caption = document.createElement('div');
        caption.className = 'portrait-caption';
        caption.innerHTML =
          '<span class="portrait-name">' + topic.person + '</span>' +
          '<span class="portrait-years">' + topic.years + '</span>';

        media.appendChild(img);
        media.appendChild(caption);

        const body = document.createElement('div');
        body.className = 'tile-body';

        const top = document.createElement('div');
        top.className = 'tile-top';

        const badgeRow = document.createElement('div');
        badgeRow.className = 'tile-badge-row';

        const numBadge = document.createElement('span');
        numBadge.className = 'tile-number';
        numBadge.textContent = 'Prinzip ' + topic.number;

        const visitedBadge = document.createElement('span');
        visitedBadge.className = 'visited-badge';
        visitedBadge.textContent = '✓ Geöffnet';

        badgeRow.appendChild(numBadge);
        badgeRow.appendChild(visitedBadge);

        const heading = document.createElement('h2');
        heading.className = 'tile-title';

        const mainLink = document.createElement('a');
        mainLink.className = 'tile-primary-link';
        mainLink.href = topic.canvaUrl;
        mainLink.target = '_blank';
        mainLink.rel = 'noopener noreferrer';
        mainLink.setAttribute('aria-label', topic.title + ' – ' + topic.person + ' in Canva öffnen');
        mainLink.textContent = topic.title;
        mainLink.addEventListener('click', function () {
          visited.add(topic.id);
          saveVisited(visited);
          updateProgressUI();
        });

        heading.appendChild(mainLink);

        const summary = document.createElement('p');
        summary.className = 'tile-summary';
        summary.textContent = topic.summary;

        top.appendChild(badgeRow);
        top.appendChild(heading);
        top.appendChild(summary);

        const footer = document.createElement('div');
        footer.className = 'tile-footer';

        const ctaRow = document.createElement('div');
        ctaRow.className = 'tile-cta-row';

        const ctaPill = document.createElement('span');
        ctaPill.className = 'canva-pill';
        ctaPill.setAttribute('aria-hidden', 'true');
        ctaPill.innerHTML =
          '<span>In Canva öffnen</span>' +
          '<svg class="canva-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M6 14L14 6M8 6h6v6"/>' +
          '</svg>';

        ctaRow.appendChild(ctaPill);

        const sourceRow = document.createElement('div');
        sourceRow.className = 'source-row';

        const sourceLink = document.createElement('a');
        sourceLink.className = 'source-link';
        sourceLink.href = topic.sourceUrl;
        sourceLink.target = '_blank';
        sourceLink.rel = 'noopener noreferrer';
        sourceLink.title = topic.sourceLabel;
        sourceLink.textContent = topic.sourceLabel;

        sourceRow.appendChild(sourceLink);

        footer.appendChild(ctaRow);
        footer.appendChild(sourceRow);

        body.appendChild(top);
        body.appendChild(footer);

        article.appendChild(media);
        article.appendChild(body);

        return article;
      }

      TOPICS.forEach(function (topic) {
        gridEl.appendChild(createTile(topic));
      });

      resetBtn.addEventListener('click', function () {
        visited.clear();
        saveVisited(visited);
        updateProgressUI();
      });

      updateProgressUI();
    })();
  </script>
</body>
</html>
