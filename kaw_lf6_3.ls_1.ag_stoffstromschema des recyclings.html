<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stoffstromschema des Recyclings Übersicht</title>
  <style>
    /* ==========================================================================
       Design-Tokens & Apple Human Interface Guidelines Farbsystem
       ========================================================================== */
    :root {
      /* Systemfarben (Light Mode) */
      --bg-primary: #F2F2F7;
      --bg-card: #FFFFFF;
      --text-primary: #1C1C1E;
      --text-secondary: #6C6C70;
      --text-tertiary: #8E8E93;
      --card-border: rgba(60, 60, 67, 0.08);
      --card-border-hover: rgba(60, 60, 67, 0.18);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --badge-bg: rgba(142, 142, 147, 0.12);
      
      /* Typografie & Geometrie */
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --radius-card: 20px;
      --radius-btn: 12px;
      --radius-icon: 14px;
      --transition-smooth: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Automatische Anpassung für Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #000000;
        --bg-card: #1C1C1E;
        --text-primary: #FFFFFF;
        --text-secondary: #8E8E93;
        --text-tertiary: #636366;
        --card-border: rgba(255, 255, 255, 0.10);
        --card-border-hover: rgba(255, 255, 255, 0.22);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.6);
        --badge-bg: rgba(255, 255, 255, 0.1);
      }
    }

    /* ==========================================================================
       Basis-Layout & Reset
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* ==========================================================================
       Header
       ========================================================================== */
    header {
      margin-bottom: 36px;
      text-align: left;
    }

    .header-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      background: var(--badge-bg);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 600px;
      line-height: 1.5;
    }

    /* ==========================================================================
       Grid & Resource Cards
       ========================================================================== */
    .resources-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 680px) {
      .resources-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .resources-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-smooth);
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--card-border-hover);
    }

    .card-top {
      margin-bottom: 24px;
    }

    .icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-icon);
      background: var(--badge-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 16px;
      user-select: none;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .card-description {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ==========================================================================
       Touch-optimierter Apple Button (min. 44px Höhe)
       ========================================================================== */
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: var(--radius-btn);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transition: var(--transition-smooth);
      user-select: none;
    }

    .action-btn:hover {
      filter: brightness(1.08);
    }

    .action-btn:active {
      transform: scale(0.97);
      filter: brightness(0.92);
    }

    .action-btn:focus-visible {
      outline: 3px solid #007AFF;
      outline-offset: 3px;
    }

    .btn-arrow {
      margin-left: 6px;
      font-size: 1rem;
      transition: transform 0.2s ease;
    }

    .action-btn:hover .btn-arrow {
      transform: translateX(3px);
    }

    /* ==========================================================================
       Footer
       ========================================================================== */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-badge">Lernportal</div>
      <h1>Stoffstromschema des Recyclings Übersicht</h1>
      <p class="subtitle">Wähle eine Station aus.</p>
    </header>

    <main>
      <div id="resources-grid" class="resources-grid">
        </div>
    </main>

    <footer>
      <p>Entwickelt für modernen browserbasierten Unterricht</p>
    </footer>
  </div>

  <script>
    /**
     * Konfigurationsobjekt für externe Lernressourcen.
     * Nutzt offizielle Apple-System-Akzentfarben (iOS / macOS HIG).
     */
    const linksConfig = [
      {
        emoji: "🎙️",
        title: "Video & Podcast",
        description: "Sowohl die europäische Verordnung (EU) 2025/40 (Packaging and Packaging Waste Regulation – PPWR) als auch das deutsche Kreislaufwirtschaftsrecht verpflichten Industrie, Kommunen und Anlagenbetreiber zu einer konsequenten Kreislaufführung. In einem interesanten Podcast wird diese Kreislaufführung im Stoffstromschema des Recyclingsprozess anschaulich besprochen.",
        buttonText: "Portal öffnen",
        url: "https://canva.link/e6wa47d4w620vcs",
        buttonColor: "#007AFF" // System Blue
      },
      {
        emoji: "🎮",
        title: "Sortierspiel",
        description: "Ordne die Fachbegriffe im Stoffstromschema des Recyclings richtige zu.",
        buttonText: "Sortierspiel starten",
        url: "https://learningapps.org/watch?v=py8vprh0v26",
        buttonColor: "#34C759" // System Green
      },
      {
        emoji: "📖",
        title: "Digitale Formelsammlung",
        description: "Schlage alle relevanten Definitionen, Formeln und Rechenwege übersichtlich strukturiert nach.",
        buttonText: "Übersicht laden",
        url: "https://wikipedia.org",
        buttonColor: "#5856D6" // System Purple
      },
  
    ];

    /**
     * Rendert die Kacheln dynamisch in das DOM.
     * Erstellt semantische HTML-Strukturen und sichert externe Links ab.
     */
    function renderResources(data) {
      const container = document.getElementById("resources-grid");
      if (!container) return;

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        // Erzeuge Kachel-Container
        const card = document.createElement("article");
        card.className = "card";

        // Oberer Inhaltsbereich
        const topSection = document.createElement("div");
        topSection.className = "card-top";

        const icon = document.createElement("div");
        icon.className = "icon-wrapper";
        icon.setAttribute("role", "img");
        icon.setAttribute("aria-label", item.title);
        icon.textContent = item.emoji;

        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = item.title;

        const desc = document.createElement("p");
        desc.className = "card-description";
        desc.textContent = item.description;

        topSection.appendChild(icon);
        topSection.appendChild(title);
        topSection.appendChild(desc);

        // Aktionsbutton
        const link = document.createElement("a");
        link.className = "action-btn";
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.backgroundColor = item.buttonColor;
        link.setAttribute("aria-label", `${item.buttonText}: ${item.title}`);
        
        link.innerHTML = `
          <span>${item.buttonText}</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        `;

        // Zusammensetzen
        card.appendChild(topSection);
        card.appendChild(link);
        fragment.appendChild(card);
      });

      container.appendChild(fragment);
    }

    // Initialisierung nach DOM-Aufbau
    document.addEventListener("DOMContentLoaded", () => {
      renderResources(linksConfig);
    });
  </script>
</body>
</html>
