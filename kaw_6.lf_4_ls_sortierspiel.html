<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortierspiel: Wiegeschein-Prüfung</title>
  <style>
    /* ==========================================================
       WINDOWS 11 FLUENT DESIGN SYSTEM & VARIABLEN
       ========================================================== */
    :root {
      --fluent-bg: #f3f5f8;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: 1px solid rgba(0, 0, 0, 0.07);
      --card-border-subtle: 1px solid rgba(255, 255, 255, 0.9);
      --accent: #0067c0;
      --accent-hover: #1886d9;
      --accent-active: #005a9e;
      --accent-wash: rgba(0, 103, 192, 0.08);
      --text-primary: #1c1c1c;
      --text-secondary: #5c5c5c;
      --text-disabled: #8a8a8a;
      
      /* Drop-Down / ComboBox Tokens */
      --combo-bg: #ffffff;
      --combo-bg-hover: #fcfcfc;
      --combo-border: rgba(0, 0, 0, 0.15);
      --combo-border-bottom: #868686;
      --flyout-bg: rgba(255, 255, 255, 0.92);
      --flyout-shadow: 0 16px 36px rgba(0, 0, 0, 0.14), 0 4px 12px rgba(0, 0, 0, 0.06);
      --divider-color: rgba(0, 0, 0, 0.08);
      
      /* Statusfarben */
      --status-success: #107c41;
      --status-success-bg: rgba(16, 124, 65, 0.12);
      --status-error: #a80000;
      --status-error-bg: rgba(168, 0, 0, 0.12);
      
      --radius-sm: 4px;
      --radius-control: 6px;
      --radius-card: 10px;
      --radius-flyout: 8px;
      --font-stack: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      --fluent-transition: all 0.18s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--fluent-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 3rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    /* DEZENTER KREISLAUFWIRTSCHAFT-HINTERGRUND (INLINE-SVG) */
    .bg-pattern {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.045;
    }

    /* HAUPTCONTAINER: VOLLE BREITE MIT LEICHTEM RANDABSTAND */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1240px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* HEADER */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: var(--card-border-subtle);
      border-radius: var(--radius-card);
      padding: 1.5rem 1.75rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    /* THEMENBEREICHE */
    .section-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .section-title {
      font-size: 1.12rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-control);
      background: var(--accent-wash);
      color: var(--accent);
      width: fit-content;
    }

    /* EINSPALTIGES GRID: JEDE KARTE NIMMT DIE VOLLE BILDSCHIRMBREITE EIN */
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--card-border);
      border-radius: var(--radius-card);
      padding: 1.35rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: var(--fluent-transition);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      width: 100%;
      position: relative;
    }

    .card.active-dropdown {
      z-index: 50;
    }

    .card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .card-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.06);
      color: var(--text-secondary);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-primary);
    }

    /* ==========================================================
       WINDOWS 11 COMBOBOX: VOLLE BREITE MIT TRENNSTRICHEN
       ========================================================== */
    .fluent-combobox {
      position: relative;
      width: 100%;
    }

    /* Auslöse-Schaltfläche */
    .combobox-button {
      width: 100%;
      min-height: 48px;
      background: var(--combo-bg);
      border: 1px solid var(--combo-border);
      border-bottom: 2px solid var(--combo-border-bottom);
      border-radius: var(--radius-control);
      padding: 0.7rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
      font-family: var(--font-stack);
      font-size: 0.95rem;
      color: var(--text-primary);
      text-align: left;
      outline: none;
      transition: var(--fluent-transition);
      user-select: none;
    }

    .combobox-button:hover {
      background: var(--combo-bg-hover);
      border-bottom-color: var(--accent);
    }

    .combobox-button:focus-visible,
    .fluent-combobox.open .combobox-button {
      border-color: var(--accent);
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 103, 192, 0.2);
    }

    .combobox-value {
      flex: 1;
      white-space: normal;
      line-height: 1.45;
    }

    .combobox-value.placeholder {
      color: var(--text-disabled);
    }

    .combobox-arrow {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--text-secondary);
      transition: transform 0.24s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .fluent-combobox.open .combobox-arrow {
      transform: rotate(180deg);
      color: var(--accent);
    }

    /* Ausklapp-Menü (Flyout) */
    .combobox-flyout {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      width: 100%;
      background: var(--flyout-bg);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: var(--radius-flyout);
      box-shadow: var(--flyout-shadow);
      padding: 0;
      display: none;
      flex-direction: column;
      z-index: 100;
      max-height: 380px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .fluent-combobox.open .combobox-flyout {
      display: flex;
      animation: fluentFlyoutOpen 0.18s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    /* Menüeintrag mit dezentem Trennstrich */
    .combobox-option {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 0.85rem 1.25rem;
      font-size: 0.93rem;
      line-height: 1.5;
      color: var(--text-primary);
      cursor: pointer;
      position: relative;
      border-bottom: 1px solid var(--divider-color);
      transition: background-color 0.12s ease;
      width: 100%;
    }

    .combobox-option:last-child {
      border-bottom: none;
    }

    .combobox-option:hover {
      background-color: rgba(0, 103, 192, 0.05);
    }

    .combobox-option .accent-pill {
      width: 3px;
      height: 22px;
      border-radius: 2px;
      background-color: transparent;
      flex-shrink: 0;
      transition: background-color 0.15s ease;
    }

    .combobox-option.selected {
      background-color: var(--accent-wash);
      font-weight: 500;
    }

    .combobox-option.selected .accent-pill {
      background-color: var(--accent);
    }

    .combobox-option-text {
      flex: 1;
    }

    /* VALIDIERUNGSSTATUS DER KARTEN */
    .card.is-valid {
      border-color: var(--status-success);
      box-shadow: 0 0 0 1px var(--status-success);
      animation: fluentPulse 0.45s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .card.is-invalid {
      border-color: var(--status-error);
      box-shadow: 0 0 0 1px var(--status-error);
      animation: fluentShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* FOOTER & BEDIENUNG */
    .action-bar {
      position: sticky;
      bottom: 1.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: var(--card-border-subtle);
      border-radius: var(--radius-card);
      padding: 1rem 1.75rem;
      box-shadow: var(--flyout-shadow);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      align-items: center;
      z-index: 40;
      width: 100%;
    }

    .controls-row {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    button.win-btn {
      font-family: var(--font-stack);
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 48px;
      padding: 0 1.8rem;
      border-radius: var(--radius-control);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      transition: var(--fluent-transition);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 14px rgba(0, 103, 192, 0.35);
    }

    .btn-primary:active:not(:disabled) {
      background-color: var(--accent-active);
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      background-color: #d6d6d6;
      color: #8c8c8c;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background-color: #ffffff;
      border-color: rgba(0, 0, 0, 0.15);
      border-bottom-color: rgba(0, 0, 0, 0.28);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: #f5f5f5;
    }

    .feedback-banner {
      width: 100%;
      padding: 0.9rem 1.35rem;
      border-radius: var(--radius-control);
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 0.65rem;
      line-height: 1.45;
    }

    .feedback-banner.success {
      display: flex;
      background-color: var(--status-success-bg);
      color: var(--status-success);
      border: 1px solid var(--status-success);
    }

    .feedback-banner.error {
      display: flex;
      background-color: var(--status-error-bg);
      color: var(--status-error);
      border: 1px solid var(--status-error);
    }

    /* CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* ANIMATIONEN */
    @keyframes fluentFlyoutOpen {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fluentShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes fluentPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.012); }
      100% { transform: scale(1); }
    }

    @media (min-width: 768px) {
      .action-bar {
        flex-direction: row;
        justify-content: space-between;
      }
      .feedback-banner {
        max-width: 65%;
      }
    }
  </style>
</head>
<body>

  <!-- KREISLAUFSYMBOLIK ALS DEZENTER HINTERGRUND -->
  <svg class="bg-pattern" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <pattern id="circ-pattern-full" width="160" height="160" patternUnits="userSpaceOnUse">
        <path d="M 45,30 A 22,22 0 0,1 68,52 L 62,52 L 72,66 L 82,52 L 76,52 A 32,32 0 0,0 45,20 Z" fill="#0067c0" />
        <path d="M 68,85 A 22,22 0 0,1 45,63 L 51,63 L 41,49 L 31,63 L 37,63 A 32,32 0 0,0 68,95 Z" fill="#0067c0" />
        <path d="M 125,100 Q 140,85 145,105 Q 130,120 125,100 Z" fill="#107c41" />
        <circle cx="125" cy="35" r="12" stroke="#000000" stroke-width="3" fill="none" stroke-dasharray="5 4" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#circ-pattern-full)" />
  </svg>

  <canvas id="confettiCanvas"></canvas>

  <main class="app-shell">
    <header>
      <h1>♻️ Entsorgungsfachbetrieb: Wiegeschein-Prüfung</h1>
      <p>Ordne den Fehlern auf dem Wiegeschein die zutreffenden betrieblichen Ursachen zu.</p>
    </header>

    <div id="gameContainer"></div>

    <footer class="action-bar">
      <div id="feedbackBanner" class="feedback-banner" role="alert"></div>
      <div class="controls-row">
        <button id="resetBtn" class="win-btn btn-secondary" type="button">
          🔄 Zurücksetzen
        </button>
        <button id="checkBtn" class="win-btn btn-primary" type="button" disabled>
          ✔️ Zuordnung prüfen
        </button>
      </div>
    </footer>
  </main>

  <script>
    /* ==========================================================
       FACHDATEN-ARRAY
       ========================================================== */
    const GAME_DATA = [
      {
        sectionId: "eingang",
        sectionTitle: "📑 Eingangs-Wiegeschein beim Entsorgungsfachbetrieb (Sortierer)",
        items: [
          {
            id: "e1",
            error: "Falsche Zuordnung des Abfallschlüssels (AVV) ➔ (sechsstellige Nummer aus der Abfallverzeichnis-Verordnung, die jede Abfallart in Deutschland eindeutig kennzeichnet)",
            correctCauseId: "c1"
          },
          {
            id: "e2",
            error: "Verwechslung von Quellgebieten (Kommunen)",
            correctCauseId: "c2"
          },
          {
            id: "e3",
            error: "Zahlendreher und Vertauschung",
            correctCauseId: "c3"
          }
        ]
      },
      {
        sectionId: "ausgang",
        sectionTitle: "🚚 Ausgangs-Wiegeschein beim Entsorgungsfachbetrieb (Sortierer)",
        items: [
          {
            id: "e4",
            error: "Zahlendreher bei Fraktionsnummern (Spezifikationen)",
            correctCauseId: "c4"
          },
          {
            id: "e5",
            error: "Fehlerhafte Zuordnung von Sortierresten",
            correctCauseId: "c5"
          }
        ]
      }
    ];

    const CAUSES = [
      {
        id: "c1",
        text: "Das Personal erfasst versehentlich den AVV-Schlüssel 15 01 01 (Papier) statt 15 01 06 (Gemischte Verpackungen)."
      },
      {
        id: "c2",
        text: "Ein Lkw aus Landkreis A wird fälschlicherweise auf Stadt B gebucht. Die Kostenabrechnung zwischen dem Dualen System und den Entsorgungsgebieten stimmt nicht mehr."
      },
      {
        id: "c3",
        text: "Das Personal vertauscht Brutto- und Taragewicht oder erfasst die Nachkommastellen falsch, wodurch physikalisch unmögliche oder negative Nettomassen in die Betriebsdatenbank einfließen."
      },
      {
        id: "c4",
        text: "Verwechslung der Kennziffern für die sortierten Monofraktionen (z. B. Spezifikation 310 statt 324). Im System wird die falsche Kunststoffart ausgebucht."
      },
      {
        id: "c5",
        text: "Reste für die Müllverbrennung werden nicht korrekt als thermische Verwertung gebucht. Die Bilanz zwischen Wertstoffen und Resten verschiebt sich unzulässig."
      }
    ];

    /* ==========================================================
       INITIALISIERUNG & DOKUMENTAUFBAU
       ========================================================== */
    const gameContainer = document.getElementById("gameContainer");
    const checkBtn = document.getElementById("checkBtn");
    const resetBtn = document.getElementById("resetBtn");
    const feedbackBanner = document.getElementById("feedbackBanner");

    const userSelections = {};
    let autoResetTimer = null;

    function renderBoard() {
      gameContainer.innerHTML = "";
      const shuffledCauses = [...CAUSES].sort(() => Math.random() - 0.5);

      GAME_DATA.forEach((group) => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "section-group";

        const titleEl = document.createElement("h2");
        titleEl.className = "section-title";
        titleEl.textContent = group.sectionTitle;
        sectionEl.appendChild(titleEl);

        const gridEl = document.createElement("div");
        gridEl.className = "cards-grid";

        group.items.forEach((item) => {
          userSelections[item.id] = "";

          const card = document.createElement("article");
          card.className = "card";
          card.id = `card-${item.id}`;
          card.dataset.itemId = item.id;
          card.dataset.correctCause = item.correctCauseId;

          card.innerHTML = `
            <div class="card-header">
              <span class="card-badge">Fehler</span>
              <p class="card-title">${item.error}</p>
            </div>
            <div class="fluent-combobox" id="combo-${item.id}" data-item="${item.id}">
              <button type="button" class="combobox-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Ursache auswählen">
                <span class="combobox-value placeholder">Ursache auswählen...</span>
                <svg class="combobox-arrow" viewBox="0 0 16 16" fill="currentColor">
                  <path fill-rule="evenodd" d="M1.646 5.646a.5.5 0 0 1 .708 0L8 11.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                </svg>
              </button>
              <div class="combobox-flyout" role="listbox">
                ${shuffledCauses.map(cause => `
                  <div class="combobox-option" role="option" data-value="${cause.id}">
                    <span class="accent-pill"></span>
                    <span class="combobox-option-text">${cause.text}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          `;

          gridEl.appendChild(card);
        });

        sectionEl.appendChild(gridEl);
        gameContainer.appendChild(sectionEl);
      });

      attachComboBoxEvents();
    }

    /* ==========================================================
       EVENT-HANDLING FÜR VOLLE BREITE & INTERAKTION
       ========================================================== */
    function attachComboBoxEvents() {
      const combos = document.querySelectorAll(".fluent-combobox");

      combos.forEach(combo => {
        const button = combo.querySelector(".combobox-button");
        const options = combo.querySelectorAll(".combobox-option");
        const itemId = combo.dataset.item;
        const parentCard = combo.closest(".card");

        button.addEventListener("click", (e) => {
          e.stopPropagation();
          const isOpen = combo.classList.contains("open");
          closeAllComboBoxes();

          if (!isOpen) {
            combo.classList.add("open");
            parentCard.classList.add("active-dropdown");
            button.setAttribute("aria-expanded", "true");
          }
        });

        options.forEach(opt => {
          opt.addEventListener("click", (e) => {
            e.stopPropagation();
            const value = opt.dataset.value;
            const text = opt.querySelector(".combobox-option-text").textContent;

            options.forEach(o => o.classList.remove("selected"));
            opt.classList.add("selected");

            const labelEl = button.querySelector(".combobox-value");
            labelEl.textContent = text;
            labelEl.classList.remove("placeholder");

            userSelections[itemId] = value;

            closeAllComboBoxes();
            clearFeedbackStates();
            checkValidationState();
          });
        });
      });

      document.addEventListener("click", () => {
        closeAllComboBoxes();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeAllComboBoxes();
        }
      });
    }

    function closeAllComboBoxes() {
      document.querySelectorAll(".fluent-combobox").forEach(c => {
        c.classList.remove("open");
        c.querySelector(".combobox-button").setAttribute("aria-expanded", "false");
      });
      document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("active-dropdown");
      });
    }

    function checkValidationState() {
      const allSelected = Object.values(userSelections).every(val => val !== "");
      checkBtn.disabled = !allSelected;
    }

    function clearFeedbackStates() {
      clearTimeout(autoResetTimer);
      document.querySelectorAll(".card").forEach(c => c.classList.remove("is-valid", "is-invalid"));
      feedbackBanner.className = "feedback-banner";
      feedbackBanner.textContent = "";
    }

    /* ==========================================================
       AUSWERTUNGS- & RESET-LOGIK
       ========================================================== */
    checkBtn.addEventListener("click", () => {
      clearTimeout(autoResetTimer);
      const cards = document.querySelectorAll(".card");
      let hasError = false;

      cards.forEach(card => {
        const itemId = card.dataset.itemId;
        const correct = card.dataset.correctCause;
        const selected = userSelections[itemId];

        if (selected === correct) {
          card.classList.remove("is-invalid");
          card.classList.add("is-valid");
        } else {
          card.classList.remove("is-valid");
          card.classList.add("is-invalid");
          hasError = true;
        }
      });

      if (!hasError) {
        feedbackBanner.className = "feedback-banner success";
        feedbackBanner.textContent = "Du hast alles richtig. Super gemacht. Gehe nun wieder zurück und übertrage das korrekte Ergebnis auf dein Arbeitsblatt";
        startConfetti();
      } else {
        feedbackBanner.className = "feedback-banner error";
        feedbackBanner.textContent = "Es sind noch Fehler vorhanden. Korrigiere diese.";

        autoResetTimer = setTimeout(() => {
          resetGame();
        }, 4500);
      }
    });

    function resetGame() {
      clearTimeout(autoResetTimer);
      closeAllComboBoxes();

      document.querySelectorAll(".fluent-combobox").forEach(combo => {
        const itemId = combo.dataset.item;
        userSelections[itemId] = "";

        const label = combo.querySelector(".combobox-value");
        label.textContent = "Ursache auswählen...";
        label.classList.add("placeholder");

        combo.querySelectorAll(".combobox-option").forEach(opt => opt.classList.remove("selected"));
      });

      clearFeedbackStates();
      checkBtn.disabled = true;
      stopConfetti();
    }

    resetBtn.addEventListener("click", resetGame);

    /* ==========================================================
       CONFETTI ENGINE
       ========================================================== */
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function startConfetti() {
      stopConfetti();
      particles = [];
      const palette = ["#0067c0", "#107c41", "#ffb900", "#d83b01", "#00a4ef"];

      for (let i = 0; i < 85; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 7 + 4,
          color: palette[Math.floor(Math.random() * palette.length)],
          vx: Math.random() * 4 - 2,
          vy: Math.random() * 3 + 2.5,
          tilt: Math.random() * 10
        });
      }

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.tilt += 0.1;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size + Math.sin(p.tilt) * 3);
        });

        particles = particles.filter(p => p.y < canvas.height + 25);

        if (particles.length > 0) {
          animationId = requestAnimationFrame(loop);
        } else {
          stopConfetti();
        }
      }
      loop();
    }

    function stopConfetti() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    renderBoard();
  </script>
</body>
</html>
